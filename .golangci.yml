version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (io.Closer).Close
        - (*database/sql.Conn).Close
        - (*database/sql.DB).Close
        - (*github.com/kmdn-app/kmdn/internal/store.DB).Close
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters: [bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
