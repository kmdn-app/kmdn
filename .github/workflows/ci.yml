name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: kmdn
          POSTGRES_DB: kmdn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test (SQLite)
        run: go test -race ./...
      - name: Test (Postgres)
        run: go test -race -count=1 ./internal/...
        env:
          KMDN_TEST_POSTGRES_URL: postgres://postgres:kmdn@localhost:5432/kmdn?sslmode=disable

  web:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test

  build:
    name: Build binary
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make build
      - name: Smoke test
        run: |
          export KMDN_SECRET_KEY=$(head -c32 /dev/urandom | base64) KMDN_DATA_DIR=$(mktemp -d) KMDN_SERVER_LISTEN=127.0.0.1:18080
          ./bin/kmdn serve & pid=$!
          for i in $(seq 1 30); do curl -sf localhost:18080/healthz && break; sleep 0.5; done
          curl -sf localhost:18080/ | grep -q '<div id="root">'
          kill $pid
