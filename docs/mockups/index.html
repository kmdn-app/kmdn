<title>kmdn Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --background:#ffffff;--foreground:#09090b;
  --card:#ffffff;--card-foreground:#09090b;
  --popover:#ffffff;--popover-foreground:#09090b;
  --primary:#18181b;--primary-foreground:#fafafa;
  --secondary:#f4f4f5;--secondary-foreground:#18181b;
  --muted:#f4f4f5;--muted-foreground:#71717a;
  --accent:#f1f1f3;--accent-foreground:#18181b;
  --border:#e4e4e7;--input:#e4e4e7;--ring:#18181b;
  --destructive:#dc2626;--destructive-foreground:#fafafa;--destructive-fg:#b91c1c;--destructive-soft:#fef2f2;
  --success:#16a34a;--success-fg:#15803d;--success-soft:#f0fdf4;
  --warning:#d97706;--warning-fg:#b45309;--warning-soft:#fffbeb;
  --info:#2563eb;--info-fg:#1d4ed8;--info-soft:#eff6ff;
  --violet:#7c3aed;--violet-fg:#6d28d9;--violet-soft:#f5f3ff;
  --slate:#52607a;--slate-soft:#f1f4f8;
  --sidebar:#fafafa;--sidebar-foreground:#27272a;--sidebar-accent:#efeff1;--sidebar-border:#ebebee;
  --chrome:#f4f4f5;--code-bg:#fafafa;--bezel:#18181b;
  --p-1:#e11d48;--p-2:#2563eb;--p-3:#059669;--p-4:#d97706;--p-5:#7c3aed;--assistant:#0891b2;
  --ins-bg:#dcfce7;--ins-fg:#166534;--del-bg:#fee2e2;--del-fg:#991b1b;
  --ins-line:#f0fdf4;--del-line:#fef2f2;
  --syn-key:#7c3aed;--syn-str:#15803d;--syn-link:#2563eb;--syn-code:#be123c;--syn-list:#b45309;--syn-muted:#a1a1aa;
  --overlay:rgb(9 9 11 / .42);
  --shadow-sm:0 1px 2px rgb(9 9 11 / .05);
  --shadow-pop:0 6px 16px -4px rgb(9 9 11 / .10),0 2px 4px -2px rgb(9 9 11 / .06);
  --shadow-dlg:0 24px 64px -16px rgb(9 9 11 / .28),0 2px 6px rgb(9 9 11 / .06);
  --radius:8px;--radius-lg:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#09090b;--foreground:#fafafa;
    --card:#0c0c0f;--card-foreground:#fafafa;
    --popover:#111114;--popover-foreground:#fafafa;
    --primary:#fafafa;--primary-foreground:#18181b;
    --secondary:#27272a;--secondary-foreground:#fafafa;
    --muted:#1c1c20;--muted-foreground:#a1a1aa;
    --accent:#232328;--accent-foreground:#fafafa;
    --border:#27272a;--input:#2e2e33;--ring:#d4d4d8;
    --destructive:#dc2626;--destructive-foreground:#fafafa;--destructive-fg:#f87171;--destructive-soft:rgb(239 68 68 / .12);
    --success:#22c55e;--success-fg:#4ade80;--success-soft:rgb(34 197 94 / .12);
    --warning:#f59e0b;--warning-fg:#fbbf24;--warning-soft:rgb(245 158 11 / .12);
    --info:#3b82f6;--info-fg:#60a5fa;--info-soft:rgb(59 130 246 / .14);
    --violet:#8b5cf6;--violet-fg:#a78bfa;--violet-soft:rgb(139 92 246 / .14);
    --slate:#9aa7bd;--slate-soft:rgb(148 163 184 / .12);
    --sidebar:#0e0e11;--sidebar-foreground:#e4e4e7;--sidebar-accent:#1d1d22;--sidebar-border:#1f1f24;
    --chrome:#111114;--code-bg:#111114;--bezel:#3f3f46;
    --p-1:#fb7185;--p-2:#60a5fa;--p-3:#34d399;--p-4:#fbbf24;--p-5:#a78bfa;--assistant:#22d3ee;
    --ins-bg:rgb(34 197 94 / .18);--ins-fg:#86efac;--del-bg:rgb(239 68 68 / .18);--del-fg:#fca5a5;
    --ins-line:rgb(34 197 94 / .07);--del-line:rgb(239 68 68 / .07);
    --syn-key:#c4b5fd;--syn-str:#86efac;--syn-link:#93c5fd;--syn-code:#fda4af;--syn-list:#fcd34d;--syn-muted:#71717a;
    --overlay:rgb(0 0 0 / .6);
    --shadow-sm:0 1px 2px rgb(0 0 0 / .3);
    --shadow-pop:0 8px 24px -6px rgb(0 0 0 / .6),0 0 0 1px rgb(255 255 255 / .02);
    --shadow-dlg:0 24px 64px -12px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --background:#09090b;--foreground:#fafafa;
  --card:#0c0c0f;--card-foreground:#fafafa;
  --popover:#111114;--popover-foreground:#fafafa;
  --primary:#fafafa;--primary-foreground:#18181b;
  --secondary:#27272a;--secondary-foreground:#fafafa;
  --muted:#1c1c20;--muted-foreground:#a1a1aa;
  --accent:#232328;--accent-foreground:#fafafa;
  --border:#27272a;--input:#2e2e33;--ring:#d4d4d8;
  --destructive:#dc2626;--destructive-foreground:#fafafa;--destructive-fg:#f87171;--destructive-soft:rgb(239 68 68 / .12);
  --success:#22c55e;--success-fg:#4ade80;--success-soft:rgb(34 197 94 / .12);
  --warning:#f59e0b;--warning-fg:#fbbf24;--warning-soft:rgb(245 158 11 / .12);
  --info:#3b82f6;--info-fg:#60a5fa;--info-soft:rgb(59 130 246 / .14);
  --violet:#8b5cf6;--violet-fg:#a78bfa;--violet-soft:rgb(139 92 246 / .14);
  --slate:#9aa7bd;--slate-soft:rgb(148 163 184 / .12);
  --sidebar:#0e0e11;--sidebar-foreground:#e4e4e7;--sidebar-accent:#1d1d22;--sidebar-border:#1f1f24;
  --chrome:#111114;--code-bg:#111114;--bezel:#3f3f46;
  --p-1:#fb7185;--p-2:#60a5fa;--p-3:#34d399;--p-4:#fbbf24;--p-5:#a78bfa;--assistant:#22d3ee;
  --ins-bg:rgb(34 197 94 / .18);--ins-fg:#86efac;--del-bg:rgb(239 68 68 / .18);--del-fg:#fca5a5;
  --ins-line:rgb(34 197 94 / .07);--del-line:rgb(239 68 68 / .07);
  --syn-key:#c4b5fd;--syn-str:#86efac;--syn-link:#93c5fd;--syn-code:#fda4af;--syn-list:#fcd34d;--syn-muted:#71717a;
  --overlay:rgb(0 0 0 / .6);
  --shadow-sm:0 1px 2px rgb(0 0 0 / .3);
  --shadow-pop:0 8px 24px -6px rgb(0 0 0 / .6),0 0 0 1px rgb(255 255 255 / .02);
  --shadow-dlg:0 24px 64px -12px rgb(0 0 0 / .7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
code,pre,kbd,.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tnum,.table td,.sb-count,.stat{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:14px;height:14px}.ic.xs{width:12px;height:12px}.ic.lg{width:20px;height:20px}.ic.xl{width:24px;height:24px}
.muted{color:var(--muted-foreground)}
.small{font-size:13px}.xsmall{font-size:12px}
.row{display:flex;align-items:center;gap:8px}.row.g4{gap:4px}.row.g12{gap:12px}.row.g16{gap:16px}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.sp{flex:1}
.ml-auto{margin-left:auto}
.b{font-weight:600}.m{font-weight:500}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- mockup chrome ---------- */
.chrome{position:sticky;top:0;z-index:80;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--border)}
.chrome .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap}
.chrome .brand .bl{color:var(--muted-foreground);font-weight:500}
.chrome-sel{position:relative;flex:0 1 340px;min-width:0}
.chrome-sel select{appearance:none;-webkit-appearance:none;width:100%;height:30px;border:1px solid var(--input);border-radius:7px;background:var(--background);padding:0 28px 0 10px;font-size:13px;color:var(--foreground)}
.chrome-sel .ic{position:absolute;right:8px;top:8px;pointer-events:none;color:var(--muted-foreground)}
.chrome .count{font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.stage{padding:16px 16px 48px}
.cap{max-width:1480px;margin:0 auto 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted-foreground)}
.cap b{color:var(--foreground);font-weight:600}
.cap code{font-size:12px;background:var(--muted);border-radius:5px;padding:1px 6px}
.cap .cap-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- frame ---------- */
.frame{position:relative;max-width:1480px;margin:0 auto;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--background);box-shadow:var(--shadow-sm),0 12px 32px -18px rgb(9 9 11 / .18)}
.frame-bar{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;background:var(--sidebar);border-bottom:1px solid var(--border)}
.frame-dots{display:flex;gap:6px;width:60px}.frame-dots i{width:10px;height:10px;border-radius:50%;background:var(--border)}
.frame-url{flex:0 1 460px;margin:0 auto;height:24px;border-radius:6px;background:var(--background);border:1px solid var(--border);font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;min-width:0}
.frame-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame-sp{width:60px}
.frame-body{position:relative;height:clamp(680px,calc(100vh - 136px),980px)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) auto;height:100%}
.sidebar{background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;min-height:0;font-size:13px;color:var(--sidebar-foreground)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;container-type:inline-size;container-name:main}
.scroll{flex:1;overflow:auto;min-height:0;position:relative;container-type:inline-size;container-name:scroll}
.rpanel{width:360px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--background)}
.app.rp-closed .rpanel{display:none}
.sb-top{padding:10px 10px 4px;display:flex;flex-direction:column;gap:6px}
.repo-switch{display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:8px;border:0;background:none;text-align:left}
.repo-switch:hover{background:var(--sidebar-accent)}
.repo-switch b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.repo-switch small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted-foreground);line-height:1.3}
.logo{width:28px;height:28px;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font:600 14px/1 "Geist Mono",ui-monospace,monospace;flex:none;letter-spacing:-.04em}
.logo.sm{width:22px;height:22px;border-radius:6px;font-size:12px}
.logo.lg{width:44px;height:44px;border-radius:11px;font-size:20px}
.sb-new{justify-content:flex-start;background:var(--background);width:100%}
.sb-new kbd{margin-left:auto}
.sb-scroll{flex:1;overflow:auto;padding:2px 10px 12px;min-height:0}
.sb-item{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font-size:13px;white-space:nowrap;border:0;background:none;width:100%;text-align:left;color:inherit}
.sb-item .ic{color:var(--muted-foreground)}
.sb-item:hover{background:var(--sidebar-accent)}
.sb-item.active{background:var(--sidebar-accent);color:var(--foreground);font-weight:500}
.sb-item.active .ic{color:var(--foreground)}
.sb-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-count{font-size:11.5px;color:var(--muted-foreground)}
.sb-count.unread{min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:10.5px;font-weight:600;padding:0 5px}
.sb-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;font-size:12px;color:var(--muted-foreground);font-weight:500}
.sb-sec button{border:0;background:none;color:var(--muted-foreground);padding:2px;border-radius:5px;display:grid}
.sb-sec button:hover{background:var(--sidebar-accent);color:var(--foreground)}
.sb-grp{padding:6px 8px 2px;font-size:11px;color:var(--muted-foreground);opacity:.85}
.sb-draft .dot{margin:0 3px}
.sb-mark{font:500 10.5px "Geist Mono",monospace;width:14px;text-align:center}
.sb-mark.M{color:var(--warning-fg)}.sb-mark.A{color:var(--success-fg)}.sb-mark.R{color:var(--info-fg)}.sb-mark.D{color:var(--destructive-fg)}
.sb-foot{border-top:1px solid var(--sidebar-border);padding:8px 10px;display:flex;align-items:center;gap:4px}
.sb-user{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px 6px;border-radius:7px}
.sb-user:hover{background:var(--sidebar-accent)}
.sb-user b{display:block;font-size:13px;font-weight:500;line-height:1.2}
.sb-user small{display:block;font-size:11.5px;color:var(--muted-foreground)}
.sb-close{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.st-editing{color:var(--slate)}.st-review{color:var(--info)}.st-changes{color:var(--warning)}.st-approved{color:var(--success)}.st-conflict{color:var(--destructive)}.st-publishing{color:var(--violet)}.st-published{color:var(--success)}.st-closed{color:var(--muted-foreground)}

.topbar{min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--border);flex:none;flex-wrap:nowrap}
.tb-sp{flex:1;min-width:8px}
.sb-toggle{display:none!important}
.bc{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted-foreground);min-width:0;white-space:nowrap}
.bc a:hover{color:var(--foreground)}
.bc .cur{color:var(--foreground);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.bc .ic{color:var(--muted-foreground);opacity:.6}
.ctx{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:var(--background);font-size:13px;font-weight:500;max-width:270px;box-shadow:var(--shadow-sm)}
.ctx:hover{background:var(--accent)}
.ctx .ctx-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .ctx-k{color:var(--muted-foreground);font-weight:400}
.edbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-bottom:1px solid var(--border);flex:none;overflow:hidden}
.edbar .vsep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.edbar .tbtn{height:28px;min-width:28px;padding:0 6px;border:0;background:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--muted-foreground);font-size:13px}
.edbar .tbtn:hover{background:var(--accent);color:var(--foreground)}
.edbar .tbtn.on{background:var(--accent);color:var(--foreground)}
.sugg{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;white-space:nowrap}
.sugg.on{color:var(--p-4)}
.savestate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground);white-space:nowrap}
@container main (max-width: 900px){.cq-hide-900{display:none!important}}
@container main (max-width: 760px){.cq-hide-760{display:none!important}.ctx{max-width:200px}}
@container main (max-width: 600px){.cq-hide-600{display:none!important}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s;user-select:none;line-height:1;text-decoration:none;flex:none}
.btn-default{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-sm)}
.btn-default:hover{background:color-mix(in oklab,var(--primary) 88%,var(--background))}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground);box-shadow:var(--shadow-sm)}
.btn-secondary:hover{background:color-mix(in oklab,var(--secondary) 80%,var(--foreground) 6%)}
.btn-outline{background:var(--background);border-color:var(--input);box-shadow:var(--shadow-sm)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--accent)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground);box-shadow:var(--shadow-sm)}
.btn-destructive:hover{background:color-mix(in oklab,var(--destructive) 88%,black)}
.btn-dout{background:var(--background);border-color:color-mix(in oklab,var(--destructive) 35%,var(--border));color:var(--destructive-fg)}
.btn-dout:hover{background:var(--destructive-soft)}
.btn-success{background:var(--success);color:#fff;box-shadow:var(--shadow-sm)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;gap:6px;border-radius:7px}
.btn-xs{height:26px;padding:0 9px;font-size:12.5px;gap:5px;border-radius:6px}
.btn-icon{width:36px;padding:0}.btn-sm.btn-icon{width:32px}.btn-xs.btn-icon{width:26px}
.btn-block{width:100%}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none}
.btn .ic{color:inherit}
.btn-ghost .ic,.btn-outline .ic{opacity:.85}
.linkbtn{border:0;background:none;padding:0;color:var(--foreground);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.linkbtn:hover{text-decoration-color:currentColor}

/* ---------- badges & pills ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap;line-height:1}
.badge-default{background:var(--primary);color:var(--primary-foreground)}
.badge-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge-outline{border-color:var(--border);color:var(--foreground)}
.badge-success{background:var(--success-soft);color:var(--success-fg);border-color:color-mix(in oklab,var(--success) 25%,transparent)}
.badge-warning{background:var(--warning-soft);color:var(--warning-fg);border-color:color-mix(in oklab,var(--warning) 25%,transparent)}
.badge-info{background:var(--info-soft);color:var(--info-fg);border-color:color-mix(in oklab,var(--info) 22%,transparent)}
.badge-destructive{background:var(--destructive-soft);color:var(--destructive-fg);border-color:color-mix(in oklab,var(--destructive) 25%,transparent)}
.badge-violet{background:var(--violet-soft);color:var(--violet-fg);border-color:color-mix(in oklab,var(--violet) 22%,transparent)}
.badge .ic{width:12px;height:12px}
.pill{--pc:var(--slate);--pb:var(--slate-soft);display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--pc);background:var(--pb);border:1px solid color-mix(in oklab,var(--pc) 20%,transparent);line-height:1;flex:none}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.review{--pc:var(--info-fg);--pb:var(--info-soft)}
.pill.changes{--pc:var(--warning-fg);--pb:var(--warning-soft)}
.pill.approved{--pc:var(--success-fg);--pb:var(--success-soft)}
.pill.conflict{--pc:var(--destructive-fg);--pb:var(--destructive-soft)}
.pill.publishing{--pc:var(--violet-fg);--pb:var(--violet-soft)}
.pill.publishing::before{animation:pulse 1.6s ease-in-out infinite}
.pill.published{--pc:var(--success-fg);--pb:transparent;border-color:color-mix(in oklab,var(--success) 30%,var(--border))}
.pill.closed{--pc:var(--muted-foreground);--pb:var(--muted);border-color:var(--border)}
@keyframes pulse{50%{opacity:.35}}
.fbadge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font:600 10.5px "Geist Mono",monospace;flex:none}
.fbadge.M{background:var(--warning-soft);color:var(--warning-fg)}.fbadge.A{background:var(--success-soft);color:var(--success-fg)}.fbadge.D{background:var(--destructive-soft);color:var(--destructive-fg)}.fbadge.R{background:var(--info-soft);color:var(--info-fg)}
.plus{color:var(--success-fg);font:500 12px "Geist Mono",monospace}.minus{color:var(--destructive-fg);font:500 12px "Geist Mono",monospace}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:var(--background);white-space:nowrap;max-width:100%}
.fchip:hover{background:var(--accent)}
.fchip span{overflow:hidden;text-overflow:ellipsis}
.fchip .ic{color:var(--muted-foreground)}
.cite{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 4px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--background);white-space:nowrap;max-width:100%}
.cite:hover{background:var(--accent)}
.cite i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted-foreground)}
.cite span{overflow:hidden;text-overflow:ellipsis}
sup.cn{font-size:10px;font-weight:600;background:var(--muted);color:var(--muted-foreground);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:2px;line-height:1}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;font-size:10.5px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--background);line-height:1;font-weight:500}

/* ---------- avatar ---------- */
.av{--c:var(--muted-foreground);width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:600 9.5px/1 "Geist",system-ui,sans-serif;display:inline-grid;place-items:center;flex:none;letter-spacing:.02em;position:relative}
:root[data-theme="dark"] .av{color:#09090b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{color:#09090b}}
.av.bot{background:var(--foreground);color:var(--background)}
.av.xs{width:18px;height:18px;font-size:8px}.av.sm{width:20px;height:20px;font-size:8.5px}.av.md{width:28px;height:28px;font-size:10.5px}.av.lg{width:36px;height:36px;font-size:12.5px}.av.xl{width:56px;height:56px;font-size:18px}
.av.bot .ic{width:60%;height:60%}
.avs{display:inline-flex;align-items:center;padding-left:6px}
.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--background)}
.av .on{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px var(--background)}

/* ---------- tabs ---------- */
.tabs{display:inline-flex;align-items:center;height:36px;padding:3px;border-radius:9px;background:var(--muted);color:var(--muted-foreground);gap:2px;max-width:100%}
.tab{height:30px;padding:0 12px;border-radius:6px;border:0;background:none;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;color:inherit;min-width:0}
.tab:hover{color:var(--foreground)}
.tab[aria-selected="true"]{background:var(--background);color:var(--foreground);box-shadow:var(--shadow-sm),0 0 0 1px color-mix(in oklab,var(--border) 60%,transparent)}
.tab .n{font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.tabs.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.tabs.sm{height:32px}.tabs.sm .tab{height:26px;font-size:12.5px;padding:0 10px}
.utabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow:hidden}
.utab{height:38px;padding:0 10px;border:0;background:none;font-size:13.5px;font-weight:500;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.utab:hover{color:var(--foreground)}
.utab[aria-selected="true"]{color:var(--foreground);border-bottom-color:var(--foreground)}
.utab .n{font-size:11.5px;background:var(--muted);border-radius:999px;padding:1px 7px;color:var(--muted-foreground)}

/* ---------- form ---------- */
.label{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px}
.help{font-size:12.5px;color:var(--muted-foreground);margin-top:6px}
.field{margin-bottom:16px}
.input,.textarea,.select{width:100%;height:36px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:transparent;font-size:14px;color:var(--foreground);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.input::placeholder,.textarea::placeholder{color:var(--muted-foreground)}
.input:focus-visible,.textarea:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 18%,transparent)}
.input.mono{font-size:13px}
.input[readonly]{background:var(--muted)}
.textarea{height:auto;padding:8px 12px;min-height:76px;resize:vertical;line-height:1.5;display:block}
.textarea.mono{font-size:13px;line-height:1.6}
.select{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--background)}
.select .ic{color:var(--muted-foreground)}
.select span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.igrp{position:relative}
.igrp>.ic{position:absolute;left:10px;top:10px;color:var(--muted-foreground)}
.igrp .input{padding-left:32px}
.iaddon{display:flex}
.iaddon .pre{display:flex;align-items:center;padding:0 10px;border:1px solid var(--input);border-right:0;border-radius:8px 0 0 8px;background:var(--muted);font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.iaddon .input{border-radius:0 8px 8px 0}
.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--input);border:0;flex:none;transition:background-color .15s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--background);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.switch.sm{width:30px;height:17px}.switch.sm::after{width:13px;height:13px}.switch.sm[aria-checked="true"]::after{transform:translateX(13px)}
.cb{width:16px;height:16px;border:1px solid var(--primary);border-radius:4px;display:inline-grid;place-items:center;flex:none;background:none;padding:0;color:var(--primary-foreground)}
.cb .ic{width:12px;height:12px;stroke-width:2.5;visibility:hidden}
.cb[aria-checked="true"]{background:var(--primary)}
.cb[aria-checked="true"] .ic{visibility:visible}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid var(--primary);display:inline-grid;place-items:center;flex:none;background:none;padding:0}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform .12s}
[aria-checked="true"]>.radio::after,.radio[aria-checked="true"]::after{transform:scale(1)}
.rcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--background);text-align:left;width:100%}
.rcard:hover{background:var(--accent)}
.rcard[aria-checked="true"]{border-color:var(--foreground);box-shadow:0 0 0 1px var(--foreground)}
.rcard .rt{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.rcard .rd{font-size:12.5px;color:var(--muted-foreground);margin-top:2px}
.sep{height:1px;background:var(--border);border:0;margin:16px 0}
.vsep{width:1px;align-self:stretch;background:var(--border)}
.or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted-foreground);margin:16px 0;text-transform:uppercase;letter-spacing:.04em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:0}
.setrow .st{font-size:14px;font-weight:500}
.setrow .sd{font-size:13px;color:var(--muted-foreground);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* ---------- card / alert / table ---------- */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);min-width:0}
.card-h{padding:18px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-t{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-d{font-size:13px;color:var(--muted-foreground);margin-top:2px}
.card-c{padding:14px 20px 18px}
.card-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px}
.card.flat{box-shadow:none}
.alert{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:var(--background);align-items:flex-start}
.alert>.ic{margin-top:2px}
.alert-t{font-weight:500;line-height:1.4}
.alert-d{color:var(--muted-foreground);margin-top:2px;line-height:1.5}
.alert .alert-a{margin-left:auto;display:flex;gap:6px;flex:none;align-self:center}
.alert.warning{border-color:color-mix(in oklab,var(--warning) 32%,var(--border));background:var(--warning-soft)}.alert.warning>.ic{color:var(--warning-fg)}
.alert.destructive{border-color:color-mix(in oklab,var(--destructive) 32%,var(--border));background:var(--destructive-soft)}.alert.destructive>.ic,.alert.destructive .alert-t{color:var(--destructive-fg)}
.alert.info{border-color:color-mix(in oklab,var(--info) 28%,var(--border));background:var(--info-soft)}.alert.info>.ic{color:var(--info-fg)}
.alert.success{border-color:color-mix(in oklab,var(--success) 28%,var(--border));background:var(--success-soft)}.alert.success>.ic{color:var(--success-fg)}
.alert.violet{border-color:color-mix(in oklab,var(--violet) 28%,var(--border));background:var(--violet-soft)}.alert.violet>.ic{color:var(--violet-fg)}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{height:38px;padding:0 12px;text-align:left;font-weight:500;color:var(--muted-foreground);border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:color-mix(in oklab,var(--muted) 55%,transparent)}
.table .num{text-align:right}
.table a.rowlink{font-weight:500}
.table a.rowlink:hover{text-decoration:underline;text-underline-offset:3px}
.tcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);min-width:0}
.li:last-child{border-bottom:0}
.li .lt{font-size:13.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ls{font-size:12.5px;color:var(--muted-foreground)}
a.li:hover .lt{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}

/* ---------- menus / dialogs / command / toast / tooltip ---------- */
.dd{position:relative;display:inline-flex;min-width:0}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:224px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow-pop);z-index:25;font-size:13.5px}
.menu.right{left:auto;right:0}
.menu.up{top:auto;bottom:calc(100% + 6px)}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:6px 8px;border-radius:6px;border:0;background:none;text-align:left;color:inherit;font-size:13.5px;white-space:nowrap}
.mi:hover,.mi.hl{background:var(--accent)}
.mi>.ic{color:var(--muted-foreground)}
.mi .mi-sub{color:var(--muted-foreground);font-size:12px;margin-left:auto}
.mi kbd{margin-left:auto}
.mi.danger{color:var(--destructive-fg)}.mi.danger .ic{color:var(--destructive-fg)}
.ml{padding:6px 8px 4px;font-size:12px;color:var(--muted-foreground);font-weight:500}
.msep{height:1px;background:var(--border);margin:4px -4px}
.overlay{position:absolute;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:24px;z-index:40;overflow:auto}
.overlay.top{align-items:flex-start;padding-top:72px}
.dialog{width:100%;max-width:520px;background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-dlg);position:relative;margin:auto}
.dialog.wide{max-width:760px}.dialog.xwide{max-width:900px}
.dlg-h{padding:22px 24px 0}
.dlg-h h2{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.dlg-h p{font-size:13.5px;color:var(--muted-foreground);margin-top:4px}
.dlg-c{padding:18px 24px}
.dlg-f{padding:0 24px 22px;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg-f .sp{min-width:0}
.dialog>.x{position:absolute;top:14px;right:14px}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--background);border-left:1px solid var(--border);box-shadow:var(--shadow-dlg);display:flex;flex-direction:column}
.cmdk{width:100%;max-width:640px;background:var(--popover);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-dlg);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-bottom:1px solid var(--border)}
.cmdk-in input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.cmdk-in .ic{color:var(--muted-foreground)}
.cmdk-list{max-height:420px;overflow:auto;padding:6px}
.cmdk-g{padding:8px 8px 4px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.cmdk-i{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;font-size:13.5px;min-width:0}
.cmdk-i:hover,.cmdk-i.hl{background:var(--accent)}
.cmdk-i>.ic{color:var(--muted-foreground)}
.cmdk-i .ct{min-width:0;flex:1}
.cmdk-i .ct b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-i .ct small{display:block;font-size:12px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk-i.sub{padding-left:34px}
.cmdk-i mark{background:color-mix(in oklab,var(--warning) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.cmdk-f{display:flex;align-items:center;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.cmdk-f span{display:inline-flex;align-items:center;gap:5px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:13px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:toastin .22s ease-out;pointer-events:auto}
.toast .ic{margin-top:2px;color:var(--success-fg)}
.toast.static{position:absolute;right:16px;bottom:16px;width:340px;max-width:calc(100% - 32px);z-index:30;animation:none}
.toast .tt{font-weight:500}.toast .td{color:var(--muted-foreground);font-size:13px;margin-top:1px}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--primary);color:var(--primary-foreground);font:500 12px/1.2 "Geist",system-ui,sans-serif;padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:60}
[data-tip].tip-up:hover::after,[data-tip].tip-up:focus-visible::after{top:auto;bottom:calc(100% + 6px)}

/* ---------- right panel ---------- */
.rp-head{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--border);min-height:52px}
.rp-head .tabs{flex:1}
.rp-head .tab{padding:0 6px;font-size:12.5px;gap:5px}
.rp-body{flex:1;display:flex;flex-direction:column;min-height:0}
.rp-scroll{flex:1;overflow:auto;padding:14px;min-height:0;font-size:13.5px}
.rp-foot{padding:10px 12px 12px;border-top:1px solid var(--border)}
.rp-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--muted-foreground)}
.thread{border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:10px;overflow:hidden}
.thread.active{border-color:color-mix(in oklab,var(--foreground) 35%,var(--border));box-shadow:var(--shadow-pop)}
.thread .quote{margin:10px 12px 0;padding-left:10px;border-left:2px solid var(--warning);font-size:12.5px;color:var(--muted-foreground);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmt{display:flex;gap:10px;padding:10px 12px}
.cmt+.cmt{padding-top:2px}
.cmt .cb-h{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.cmt .cb-h b{font-weight:600}
.cmt .cb-h time{font-size:12px;color:var(--muted-foreground)}
.cmt .cb-t{font-size:13.5px;line-height:1.5;margin-top:2px}
.cmt .cb-body{flex:1;min-width:0}
.mention{color:var(--info-fg);background:var(--info-soft);border-radius:4px;padding:0 3px;font-weight:500}
.thread .reply{display:flex;gap:8px;align-items:center;padding:8px 12px 10px}
.thread .reply .input{height:32px;font-size:13px}
.thread .t-acts{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.sgcard .sg-what{font-size:13px;line-height:1.55;margin-top:4px;padding:8px 10px;border-radius:8px;background:var(--muted)}
.resolved-row{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:12.5px;color:var(--muted-foreground)}

/* ---------- composer / chat ---------- */
.composer{border:1px solid var(--border);border-radius:16px;background:var(--background);box-shadow:var(--shadow-sm),0 4px 16px -8px rgb(9 9 11 / .08);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:color-mix(in oklab,var(--ring) 45%,var(--border))}
.composer textarea{display:block;width:100%;border:0;background:none;resize:none;padding:12px 14px 4px;font-size:14px;line-height:1.5;outline:none;min-height:44px}
.composer textarea::placeholder{color:var(--muted-foreground)}
.composer.big textarea{font-size:15px;padding:16px 18px 6px;min-height:76px}
.composer-bar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
.composer.big .composer-bar{padding:8px 10px 10px}
.cb-left{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden}
.cchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:999px;border:1px solid transparent;background:none;font-size:12.5px;color:var(--muted-foreground);white-space:nowrap;flex:none}
.cchip:hover{background:var(--accent);color:var(--foreground)}
.cchip.b{border-color:var(--border)}
.cchip .ic{width:14px;height:14px}
.send{width:32px;height:32px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;flex:none}
.send:hover{opacity:.9}
.send.off{background:var(--muted);color:var(--muted-foreground)}
.chat{display:flex;flex-direction:column;gap:16px}
.msg-u{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.msg-u .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground)}
.msg-u .bub{background:var(--muted);border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:13.5px;line-height:1.5}
.msg-a{display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.6}
.msg-a .who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.msg-a .who time{color:var(--muted-foreground);font-weight:400}
.msg-a ol,.msg-a ul{margin:0;padding-left:20px}
.msg-a li{margin:2px 0}
.msg-a p{margin:0}
.work{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
.work-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:500;border-bottom:1px solid var(--border)}
.work-h .ic{color:var(--success-fg)}
.work-c{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
.work-f{padding:0 12px 12px;display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-foreground)}
.step .ic{color:var(--muted-foreground)}
.thread-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);padding:8px 10px;border-radius:8px;background:var(--muted)}

/* ---------- document ---------- */
.doc{max-width:720px;margin:0 auto;padding:40px 24px 160px;font-size:16px;line-height:1.7;position:relative}
.doc h1{font-size:34px;line-height:1.18;letter-spacing:-.028em;font-weight:650;margin:4px 0 14px}
.doc h2{font-size:22px;line-height:1.3;letter-spacing:-.018em;font-weight:600;margin:36px 0 10px}
.doc h3{font-size:18px;line-height:1.35;letter-spacing:-.01em;font-weight:600;margin:28px 0 8px}
.doc p{margin:0 0 16px}
.doc a,.doc .lnk{color:var(--foreground);text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--foreground) 30%,transparent);text-underline-offset:3px}
.doc :not(pre)>code{font-size:.86em;background:var(--muted);padding:.12em .38em;border-radius:5px;border:1px solid var(--border)}
.doc ul,.doc ol{padding-left:1.4em;margin:0 0 16px}
.doc li{margin:4px 0}
.tasks{list-style:none;padding-left:0!important}
.tasks li{display:flex;gap:10px;align-items:flex-start}
.tasks .cb{margin-top:5px}
.tasks li.done>span{color:var(--muted-foreground);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--muted-foreground) 60%,transparent)}
.doc table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;margin:4px 0 20px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.doc th,.doc td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.doc th+th,.doc td+td{border-left:1px solid var(--border)}
.doc tr:last-child td{border-bottom:0}
.doc th{background:var(--muted);font-weight:600;font-size:14px}
.byline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground);margin:-2px 0 24px;flex-wrap:wrap}
.byline b{color:var(--foreground);font-weight:500}
.blk{position:relative}
.handle{position:absolute;left:-54px;top:3px;display:flex;gap:1px;opacity:0;transition:opacity .12s}
.handle button{width:24px;height:24px;border:0;background:none;border-radius:5px;display:grid;place-items:center;color:var(--muted-foreground);padding:0}
.handle button:hover{background:var(--accent);color:var(--foreground)}
.blk:hover>.handle,.blk.hover>.handle{opacity:1}
.blk.hover{border-radius:6px;box-shadow:0 0 0 6px color-mix(in oklab,var(--muted) 70%,transparent);background:color-mix(in oklab,var(--muted) 70%,transparent)}
@container scroll (max-width: 779px){.handle{display:none}}
.props{border:1px solid var(--border);border-radius:10px;margin:0 0 28px;font-size:13.5px;line-height:1.4;background:var(--card)}
.props-head{display:flex;align-items:center;gap:6px;width:100%;padding:8px 12px;border:0;background:none;color:var(--muted-foreground);font-size:12.5px;font-weight:500;border-bottom:1px solid var(--border);text-align:left}
.props-head .src{margin-left:auto;font:400 11.5px "Geist Mono",monospace}
.props-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:34px;padding:2px 12px}
.props-row:hover{background:color-mix(in oklab,var(--muted) 55%,transparent)}
.prop-k{color:var(--muted-foreground);display:flex;gap:8px;align-items:center;font-size:13px}
.prop-v{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.tagchip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--muted);font-size:12.5px;border:1px solid var(--border)}
.props-add{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;font-size:12.5px;color:var(--muted-foreground)}
.figure{margin:4px 0 20px}
.figure .img{border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--muted);line-height:0}
.figure .img svg{width:100%;height:auto;display:block}
.figure figcaption,.figure .cap2{font-size:13px;color:var(--muted-foreground);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codeblk{border:1px solid var(--border);border-radius:10px;background:var(--code-bg);margin:4px 0 20px;overflow:hidden}
.codeblk-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:12px;color:var(--muted-foreground);border-bottom:1px solid var(--border)}
.codeblk pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.65}
.codeblk .c-cmd{color:var(--syn-key)}.codeblk .c-str{color:var(--syn-str)}.codeblk .c-com{color:var(--syn-muted)}.codeblk .c-flag{color:var(--syn-link)}
.rawblk{border:1px dashed color-mix(in oklab,var(--muted-foreground) 45%,transparent);border-radius:10px;background:var(--muted);margin:4px 0 20px;overflow:hidden}
.rawblk-h{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;font-size:12px;color:var(--muted-foreground);font-weight:500}
.rawblk-h .sp{flex:1}
.rawblk pre{margin:0;padding:2px 12px 12px;font-size:13.5px;color:var(--muted-foreground);overflow-x:auto}
.mermaid{border:1px solid var(--border);border-radius:10px;margin:4px 0 20px;background:var(--card);overflow:hidden}
.mermaid-h{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;font-size:12px;color:var(--muted-foreground);border-bottom:1px solid var(--border)}
.mermaid-h .sp{flex:1}
.mermaid svg{display:block;width:100%;height:auto;padding:14px}
.mm-n{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.mm-n.hl{fill:var(--muted)}
.mm-t{fill:var(--foreground);font:500 12.5px "Geist",system-ui,sans-serif}
.mm-e{stroke:var(--muted-foreground);stroke-width:1.2;fill:none}
.mm-a{fill:var(--muted-foreground)}
.mm-l{fill:var(--muted-foreground);font:500 11px "Geist",system-ui,sans-serif}
.math{font-family:"Latin Modern Math","STIX Two Math","Cambria Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.math i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1;margin:0 2px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.footnotes{border-top:1px solid var(--border);margin-top:36px;padding-top:12px;font-size:13.5px;color:var(--muted-foreground)}
.footnotes ol{padding-left:1.2em}
sup.fn{font-size:11px;margin-left:1px}
sup.fn a{text-decoration:none!important;color:var(--info-fg)!important}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.6}
.callout .ic{margin-top:4px;color:var(--muted-foreground)}
/* presence */
.caret{position:relative;display:inline-block;width:2px;height:1.2em;margin:0 -1px;vertical-align:-0.22em;background:var(--c);border-radius:1px}
.caret>.flag{position:absolute;bottom:100%;left:-1px;margin-bottom:1px;white-space:nowrap;background:var(--c);color:#fff;font:600 10.5px/1 "Geist",system-ui,sans-serif;padding:3px 6px 3px 5px;border-radius:4px 4px 4px 0;pointer-events:none;letter-spacing:.01em}
:root[data-theme="dark"] .caret>.flag{color:#09090b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .caret>.flag{color:#09090b}}
.rsel{background:color-mix(in oklab,var(--c) 22%,transparent);border-radius:2px}
.lsel{background:color-mix(in oklab,var(--info) 24%,transparent);border-radius:2px}
.cmt-anchor{background:color-mix(in oklab,var(--warning) 20%,transparent);border-bottom:2px solid color-mix(in oklab,var(--warning) 60%,transparent);cursor:pointer}
.bubble{position:absolute;display:flex;align-items:center;gap:1px;padding:3px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);z-index:6;white-space:nowrap}
.bubble button{height:28px;min-width:28px;padding:0 7px;border:0;background:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--foreground);font-size:12.5px;font-weight:500}
.bubble button:hover,.bubble button.on{background:var(--accent)}
@container scroll (max-width: 620px){.bubble{display:none!important}}
.bubble .vs{width:1px;height:18px;background:var(--border);margin:0 3px}
.slash{position:absolute;top:calc(100% + 2px);left:0;width:300px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:4px;z-index:6;font-size:13.5px;line-height:1.3}
.slash .si{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px}
.slash .si:hover,.slash .si.hl{background:var(--accent)}
.slash .si .sico{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;background:var(--background);flex:none}
.slash .si b{display:block;font-weight:500;font-size:13.5px}
.slash .si small{display:block;font-size:12px;color:var(--muted-foreground)}
.slash-p{color:var(--muted-foreground)}
.slash-p .q{color:var(--foreground);background:var(--muted);border-radius:4px;padding:0 3px}
/* margin comments */
.mb{position:absolute;right:-60px;top:2px;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--border);border-radius:999px;background:var(--background);font-size:12px;color:var(--muted-foreground);box-shadow:var(--shadow-sm);z-index:2}
.mb:hover{color:var(--foreground);background:var(--accent)}
.mb.on{border-color:color-mix(in oklab,var(--warning) 55%,var(--border));color:var(--warning-fg)}
.mcard{display:none;position:absolute;left:calc(100% + 72px);top:-4px;width:250px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow-pop);font-size:13px;line-height:1.45;z-index:3}
.app.rp-closed .mcard{display:block}
.app.rp-closed .has-margin{margin-left:max(0px,calc((100% - 1060px) / 2))}
@container scroll (max-width: 1080px){.mcard{display:none!important}}
@container scroll (max-width: 779px){.mb{position:static;margin:0 0 8px;box-shadow:none}}
/* suggestions & diff */
.sg-ins{background:color-mix(in oklab,var(--c) 15%,transparent);border-bottom:2px solid var(--c);text-decoration:none;border-radius:2px 2px 0 0;color:inherit}
.sg-del{text-decoration:line-through;text-decoration-color:var(--c);text-decoration-thickness:2px;color:var(--muted-foreground);background:color-mix(in oklab,var(--c) 7%,transparent)}
.sg-blk{border-left:3px solid var(--c);padding-left:14px;margin-left:-17px;background:linear-gradient(90deg,color-mix(in oklab,var(--c) 7%,transparent),transparent 80%)}
.sg-tag{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 "Geist",system-ui,sans-serif;color:var(--c);background:color-mix(in oklab,var(--c) 12%,transparent);border-radius:4px;padding:3px 6px;vertical-align:2px;margin-left:6px}
ins.d,.d-ins{background:var(--ins-bg);color:var(--ins-fg);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;border-radius:2px}
del.d,.d-del{background:var(--del-bg);color:var(--del-fg);text-decoration:line-through;border-radius:2px}
.d-blk-ins{border-left:3px solid var(--success);padding-left:14px;margin-left:-17px;background:linear-gradient(90deg,var(--ins-line),transparent 85%)}
.d-blk-del{border-left:3px solid var(--destructive);padding-left:14px;margin-left:-17px;background:linear-gradient(90deg,var(--del-line),transparent 85%)}
.d-lbl{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 "Geist",system-ui,sans-serif;border-radius:4px;padding:3px 6px;margin-bottom:6px}
.d-lbl.ins{color:var(--ins-fg);background:var(--ins-bg)}.d-lbl.del{color:var(--del-fg);background:var(--del-bg)}
/* blame */
.doc.blame-on{max-width:960px;padding-left:264px}
.blame-g{position:absolute;left:-240px;top:4px;width:216px;display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.35;color:var(--muted-foreground);padding-right:12px;border-right:2px solid var(--c)}
.blame-g b{display:block;color:var(--foreground);font-weight:500}
.blame-g a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--border)}
@container scroll (max-width: 900px){.doc.blame-on{padding-left:24px}.blame-g{position:static;width:auto;border-right:0;border-left:2px solid var(--c);padding:0 0 0 8px;margin-bottom:6px}}

/* ---------- source editor ---------- */
.cm{font-family:"Geist Mono",ui-monospace,monospace;font-size:13.5px;line-height:1.75;padding:16px 0 120px;max-width:980px;margin:0 auto}
.cm-l{display:grid;grid-template-columns:56px minmax(0,1fr);position:relative}
.cm-l .n{text-align:right;padding-right:14px;color:var(--syn-muted);user-select:none;font-size:12.5px}
.cm-l .t{white-space:pre-wrap;word-break:break-word;padding:0 24px 0 12px;border-left:1px solid var(--border);min-height:1.75em}
.cm-l.act{background:color-mix(in oklab,var(--muted) 70%,transparent)}
.cm-l.act .n{color:var(--foreground)}
.t-fm{color:var(--syn-muted)}.t-k{color:var(--syn-key)}.t-s{color:var(--syn-str)}.t-p{color:var(--syn-muted)}
.t-hm{color:var(--syn-muted);font-weight:600}.t-h{color:var(--foreground);font-weight:700}
.t-list{color:var(--syn-list)}.t-lt{color:var(--syn-link)}.t-url{color:var(--muted-foreground);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px}
.t-ic{color:var(--syn-code)}.t-b{font-weight:700}.t-fence{color:var(--syn-muted)}.t-code{color:var(--syn-code)}
.t-raw{color:var(--warning-fg);background:var(--warning-soft);border-radius:3px}.t-math{color:var(--syn-key)}.t-fn{color:var(--syn-link)}

/* ---------- source diff ---------- */
.sdiff{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.sdiff-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;background:var(--sidebar);flex-wrap:wrap}
.sdiff-scroll{overflow-x:auto}
.sdiff table{border-collapse:collapse;width:100%;min-width:860px;font:12.5px/1.7 "Geist Mono",ui-monospace,monospace;table-layout:fixed}
.sdiff.unified table{min-width:620px}
.sdiff td{padding:0 10px;white-space:pre-wrap;word-break:break-word;vertical-align:top}
.sdiff td.ln{width:46px;text-align:right;color:var(--syn-muted);user-select:none;padding:0 8px;white-space:nowrap}
.sdiff td.sg{width:18px;padding:0;text-align:center;color:var(--syn-muted);user-select:none}
.sdiff .del{background:var(--del-line)}.sdiff .ins{background:var(--ins-line)}
.sdiff td.del.ln,.sdiff td.del.sg{color:var(--del-fg);background:color-mix(in oklab,var(--del-bg) 60%,transparent)}
.sdiff td.ins.ln,.sdiff td.ins.sg{color:var(--ins-fg);background:color-mix(in oklab,var(--ins-bg) 60%,transparent)}
.sdiff td.emp{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklab,var(--muted) 80%,transparent) 6px 7px)}
.sdiff mark.w{border-radius:3px;color:inherit}
.sdiff .del mark.w{background:var(--del-bg)}.sdiff .ins mark.w{background:var(--ins-bg)}
.sdiff td.split{border-left:1px solid var(--border)}
.sdiff .hunk td{background:var(--info-soft);color:var(--info-fg);padding:2px 10px}
.sdiff .lcmt td{padding:8px 12px;background:var(--background);white-space:normal;font-family:"Geist",system-ui,sans-serif;font-size:13.5px;line-height:1.5}
.lcmt .thread{max-width:560px;margin:0}
.addcmt{width:18px;height:18px;border-radius:5px;background:var(--info);color:#fff;display:inline-grid;place-items:center;border:0;padding:0;vertical-align:-3px;margin-left:-4px}
.addcmt .ic{width:12px;height:12px;stroke-width:2.2}

/* ---------- pages ---------- */
.page{max-width:1080px;margin:0 auto;padding:28px 32px 80px}
.page.narrow{max-width:780px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.ph p{color:var(--muted-foreground);font-size:14px;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;max-width:1080px;margin:0 auto;padding:28px 32px 80px}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:start}
.snav .sn-h{font-size:12px;color:var(--muted-foreground);font-weight:500;padding:4px 10px 8px}
.snav button{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;border:0;background:none;font-size:13.5px;text-align:left;color:var(--muted-foreground);white-space:nowrap}
.snav button:hover{background:var(--accent);color:var(--foreground)}
.snav button[aria-selected="true"]{background:var(--accent);color:var(--foreground);font-weight:500}
.snav button.danger{color:var(--destructive-fg)}
.spanel{container-type:inline-size}
@container (max-width: 700px){.hcq{display:none!important}}
@container (max-width: 440px){.hcq2{display:none!important}}
.spanel h2{font-size:18px;font-weight:600;letter-spacing:-.015em}
.spanel>p.sd{color:var(--muted-foreground);font-size:13.5px;margin:4px 0 20px}
.spanel .card+.card{margin-top:16px}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 12px;font-size:13.5px}
.kv dt{color:var(--muted-foreground)}.kv dd{margin:0;min-width:0}
.tl{position:relative;padding-left:30px}
.tl-i{position:relative;padding-bottom:18px;font-size:13.5px;line-height:1.5}
.tl-i::before{content:"";position:absolute;left:-20px;top:24px;bottom:0;width:1px;background:var(--border)}
.tl-i:last-child::before{display:none}
.tl-ico{position:absolute;left:-30px;top:0;width:22px;height:22px;border-radius:50%;background:var(--background);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted-foreground)}
.tl-ico .ic{width:12px;height:12px}
.tl-ico.av{border:0}
.tl-i time{font-size:12px;color:var(--muted-foreground)}
.tl-i .tl-x{margin-top:6px}
.stepper{display:flex;flex-direction:column;gap:2px}
.stp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted-foreground);border:0;background:none;text-align:left;width:100%}
.stp .sn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;background:var(--background)}
.stp.done .sn{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.stp.done{color:var(--foreground)}
.stp.cur,.stp[aria-selected="true"]{background:var(--accent);color:var(--foreground);font-weight:500}
.stp.cur .sn,.stp[aria-selected="true"] .sn{border-color:var(--foreground);color:var(--foreground)}
.hsteps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hsteps .stp{width:auto;padding:6px 10px}
.hsteps .ln{width:24px;height:1px;background:var(--border)}
.fullpage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--sidebar);position:relative}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);padding:32px}
.auth-card h1{font-size:20px;font-weight:600;letter-spacing:-.02em;text-align:center;margin-top:14px}
.auth-card>p{text-align:center;color:var(--muted-foreground);font-size:14px;margin:6px 0 24px}
.auth-card .btn+.btn{margin-top:8px}
.auth-logo{display:flex;justify-content:center}
.fine{font-size:12px;color:var(--muted-foreground);text-align:center;margin-top:20px;line-height:1.5}
.icon-circle{width:48px;height:48px;border-radius:50%;background:var(--muted);display:grid;place-items:center;margin:0 auto}
.icon-circle .ic{width:22px;height:22px}
.fp-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted-foreground)}
.home-hero{max-width:720px;margin:28px auto 36px;text-align:left}

# Your first week at Northwind

Welcome to Northwind! This page walks you through your first five days: what to sort out before you start, who you'll meet, and how to get your laptop and accounts working. If something here is out of date, open a revision and fix it \u2014 everyone can.

## Before day one

- [x] Sign your contract and upload your ID in Personio
- [x] Choose your laptop (see [IT setup](it-setup.md#your-laptop))
- [ ] Set up your Northwind Google account from the welcome email
- [ ] Read the [remote work policy](../policies/remote-work.md)

## Day 1: get set up

Pick up your badge from the security desk on the ground floor, then your buddy meets you at 9:30. IT will have your laptop ready; the full checklist is in [IT setup](it-setup.md).

![The welcome desk on floor 2 of the Lisbon office](images/welcome-desk.jpg)

## Your first-week schedule

Your manager shares a detailed plan on Monday. Ask them to add you to the team calendar so the invites land in the right place.

| Day       | Focus                          | Who you'll meet   |
|-----------|--------------------------------|-------------------|
| Monday    | Accounts, laptop and badge     | IT and your buddy |
| Tuesday   | Product walkthrough            | Product team      |
| Wednesday | How we work: rituals and tools | Your manager      |
| Thursday  | Shadow a support shift         | Customer support  |
| Friday    | Your first retro               | The whole team    |

Paid leave starts on day one: you accrue $\frac{25}{12} \approx 2.08$ days per month.[^1]

## Connect to the VPN

Connect before opening internal tools like Grafana or the admin panel. Run these commands in Terminal, then sign in with your Google account (ask IT for an auth key if sign-in fails):

~~~bash
brew install --cask tailscale
tailscale up --login-server https://vpn.northwind.dev
~~~

## Getting help

~~~mermaid
flowchart LR
  A[New question] --> B[Search the handbook] --> C{Answered?}
  C -- yes --> D[You're all set]
  C -- no --> E[Ask in #it-help]
~~~

{{< youtube id="7xk2QpL9mEc" title="Welcome to Northwind" >}}

[^1]: Pro-rated for part-time contracts. See the [leave policy](../policies/leave.md).`.replace(/~~~/g,TICKS).replace(/\\u([0-9a-f]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
function hlInline(e){
  if(/^#{1,6} /.test(e))return e.replace(/^(#{1,6} )(.*)$/,'<span class="t-hm">$1</span><span class="t-h">$2</span>');
  if(/^\{\{&lt;/.test(e))return `<span class="t-raw">${e}</span>`;
  if(/^\|/.test(e))return e.replace(/\|/g,'<span class="t-p">|</span>').replace(/-{3,}/g,m=>`<span class="t-p">${m}</span>`);
  e=e.replace(/^(\s*)([-*]|\d+\.)( \[[ x]\])?( )/,(m,s,b,c,sp)=>`${s}<span class="t-list">${b}${c||''}</span>${sp}`);
  e=e.replace(/(!?)\[([^\]]*)\]\(([^)]*)\)/g,(m,bang,t,u)=>`<span class="t-p">${bang}[</span><span class="t-lt">${t}</span><span class="t-p">](</span><span class="t-url">${u}</span><span class="t-p">)</span>`);
  e=e.replace(/`([^`]+)`/g,'<span class="t-ic">`$1`</span>');
  e=e.replace(/\*\*([^*]+)\*\*/g,'<span class="t-b">**$1**</span>');
  e=e.replace(/\$([^$]+)\$/g,'<span class="t-math">$$$1$$</span>');
  e=e.replace(/\[\^(\d+)\](:?)/g,'<span class="t-fn">[^$1]$2</span>');
  return e;
}
function hlSource(lines){
  let fm=false,code=false;
  return lines.map((l,i)=>{
    const e=esc(l);
    if(l==='---'&&(i===0||fm)){fm=i===0;return `<span class="t-fm">${e}</span>`;}
    if(fm)return e.replace(/^([\w-]+):(.*)$/,'<span class="t-k">$1</span><span class="t-p">:</span><span class="t-s">$2</span>');
    if(l.startsWith(TICKS)){code=!code;return `<span class="t-fence">${e}</span>`;}
    if(code)return `<span class="t-code">${e}</span>`;
    return hlInline(e);
  });
}

const hlD=s=>{const e=esc(s);const h=/^[\w-]+: /.test(s)?e.replace(/^([\w-]+):(.*)$/,'<span class="t-k">$1</span><span class="t-p">:</span>$2'):(s===TICKS||s.startsWith(TICKS)?`<span class="t-fence">${e}</span>`:hlInline(e));return h.replace(/\u00ab([^\u00bb]*)\u00bb/g,'<mark class="w">$1</mark>')};
const LCMT=()=>`<div style="max-width:560px">${thread({active:true,me:'maya',items:[cmt('maya','\u201cWaiting on your desk\u201d is only true for Lisbon. Remote hires get theirs shipped. Can we say both?','8 min ago'),cmt('tom','Good point, I\u2019ll ask the assistant for a remote version.','3 min ago')],acts:`<button class="btn btn-outline btn-xs">${ic('check','sm')}Resolve</button><span class="xsmall muted" style="align-self:center">on line 13</span>`})}</div>`;
function splitDiff(data){
  const out=[];let i=0;
  while(i<data.length){
    const r=data[i];
    if(r[0]==='c'){out.push(`<tr><td class="ln">${r[1]}</td><td>${hlD(r[3])}</td><td class="ln split">${r[2]}</td><td>${hlD(r[3])}</td></tr>`);i++;continue;}
    if(r[0]==='hunk'){out.push(`<tr class="hunk"><td colspan="4">${esc(r[1])}</td></tr>`);i++;continue;}
    if(r[0]==='cmt'){out.push(`<tr class="lcmt"><td colspan="4">${LCMT()}</td></tr>`);i++;continue;}
    const d=[],a=[];while(i<data.length&&data[i][0]==='d'){d.push(data[i]);i++}while(i<data.length&&data[i][0]==='a'){a.push(data[i]);i++}
    for(let j=0;j<Math.max(d.length,a.length);j++){const L=d[j],N=a[j];
      out.push(`<tr>${L?`<td class="ln del">${L[1]}</td><td class="del">${hlD(L[3])}</td>`:'<td class="ln emp"></td><td class="emp"></td>'}${N?`<td class="ln ins split">${N[2]===13?`<button class="addcmt" aria-label="Comment on line 13">${ic('plus')}</button> `:''}${N[2]}</td><td class="ins">${hlD(N[3])}</td>`:'<td class="ln emp split"></td><td class="emp"></td>'}</tr>`);}
  }
  return `<table><colgroup><col style="width:52px"><col><col style="width:52px"><col></colgroup><tbody>${out.join('')}</tbody></table>`;
}
function unifiedDiff(data){
  return `<table><colgroup><col style="width:46px"><col style="width:46px"><col style="width:20px"><col></colgroup><tbody>${data.map(r=>{
    if(r[0]==='hunk')return `<tr class="hunk"><td colspan="4">${esc(r[1])}</td></tr>`;
    if(r[0]==='cmt')return `<tr class="lcmt"><td colspan="4">${LCMT()}</td></tr>`;
    const k=r[0]==='d'?'del':r[0]==='a'?'ins':'';
    return `<tr><td class="ln ${k}">${r[1]??''}</td><td class="ln ${k}">${r[2]??''}</td><td class="sg ${k}">${r[0]==='d'?'\u2212':r[0]==='a'?'+':''}</td><td class="${k}">${hlD(r[3])}</td></tr>`;}).join('')}</tbody></table>`;
}

    <div data-tabpanel="${set}:all">${all}</div><div data-tabpanel="${set}:c" hidden>${c.map(findingCard).join('')}</div><div data-tabpanel="${set}:d" hidden>${d.map(findingCard).join('')}</div>
  </div>`}));
};

/* ================= index & registry ================= */
const SCREENS=[
  ['index','','Index','All screens','grid'],
  ['signin','Onboarding & auth','Sign in','Magic link, passkey, or GitHub / GitLab. Includes the \u201cCheck your email\u201d state.','mail'],
  ['setup','Onboarding & auth','First-run setup','Wizard: admin, SMTP (with test), forge, AI provider.','settings'],
  ['connect-repo','Onboarding & auth','Connect a repository','Pick forge and repo, set content root, branch and globs, see protection check.','server'],
  ['invite','Onboarding & auth','Accept invite','Maya invited you to northwind/handbook as Contributor.','userplus'],
  ['home','Reading','Repo home','Codex-style \u201cWhat do you want to change?\u201d composer, reviews, revisions, recent pages.','home'],
  ['doc-published','Reading','Published page','Reading first-week.md: \u201cUpdated since your last visit\u201d, Follow, discussions sorted by hot topics.','filetext'],

  ['source','Editing','Source mode','CodeMirror-style markdown with line numbers and Priya\u2019s cursor.','code'],
  ['draft-overview','Editing','Revision overview','Files changed, checks (incl. consistency, updates from Published), editors, reviewers, activity.','filepen'],

  ['drafts','Editing','Revisions list','Mine, Review requested, All, with state pills.','list'],

  ['publish','Review & publish','Publish','Commit message, trailers, Verified, protected-branch variant.','upload'],
  ['history','History','History & blame','Published versions, checkpoints and a blame overlay.','history'],
  ['assistant','Assistant','Assistant Q&A','Private repo Q&A with citations and \u201cStart a revision\u201d.','sparkles'],
  ['inbox','Settings & admin','Inbox','Updates grouped per revision, browser push hint, followed pages.','inbox'],
  ['repo-settings','Settings & admin','Repository settings','General, members, review rules, assets, integrations, danger zone.','settings'],
  ['admin','Settings & admin','Admin console','Users, groups, forges, AI provider, SMTP, agent keys (MCP), audit log.','shield'],
  ['profile','Settings & admin','Your account','Co-author email, linked accounts, passkeys, notifications (follows, push), theme.','user'],
  ['mobile','Settings & admin','Mobile','Reading with update banner and comment sheet; reviewing with Result / Changes.','phone']

const GROUPS=['Onboarding & auth','Reading','Editing','Review & publish','History','Assistant','Settings & admin'];
R.index=()=>`<div class="index">
  <div class="ix-hero"><span class="logo lg">k</span><div><h1>kmdn mockups</h1><p>Collaborative markdown editing with a git backend. ${SCREENS.length-1} screens from the Northwind instance: people edit a revision together, assigned reviewers approve, kmdn publishes one commit.</p></div></div>
  <div class="ix-legend"><span class="lg-h">Revision states</span>${Object.keys(ST).map(pill).join('')}<span class="xsmall muted" style="flex-basis:100%">Conflicts send a revision back to Editing; the Conflict pill in lists means \u201cEditing \u00b7 has conflicts\u201d. Updates from Published are previewed, then applied.</span></div>
  <div class="ix-legend"><span class="lg-h">People</span>${['maya','tom','priya','luis','sam','bot'].map(k=>`<span class="row small">${av(k,'sm')}${P[k].n}<span class="muted">${k==='bot'?'agent':P[k].r}</span></span>`).join('')}</div>
  ${GROUPS.map(g=>`<h2 class="ix-g">${g}</h2><div class="ix-grid">${SCREENS.filter(s=>s[1]===g).map(s=>`<a class="ix-card" href="#${s[0]}"><span class="ix-thumb">${ic(s[4],'lg')}</span><div style="min-width:0"><div class="ix-n">${s[2]}</div><div class="ix-d">${s[3]}</div><code>#${s[0]}</code></div></a>`).join('')}</div>`).join('')}

const CAPACTS={
  signin:`<button class="btn btn-outline btn-xs" data-swap="si-form,si-check">Sign-in form</button><button class="btn btn-outline btn-xs" data-swap="si-check,si-form">Check your email</button>`,
  'new-draft':`<button class="btn btn-outline btn-xs" data-swap="nd-new,nd-move">New revision dialog</button><button class="btn btn-outline btn-xs" data-swap="nd-move,nd-new">Move / rename dialog</button>`,
  editor:`<button class="btn btn-outline btn-xs" data-panel-toggle-screen>Toggle right panel</button>`,
  'doc-published':`<button class="btn btn-outline btn-xs" data-panel-toggle-screen>Close panel to see margin threads</button>`,
  publish:`<button class="btn btn-outline btn-xs" data-open="pub-dlg">Open publish dialog</button>`,
  'connect-repo':`<button class="btn btn-outline btn-xs" data-open="cr-dlg">Open dialog</button>`,
  admin:`<span class="xsmall muted">Agent keys (MCP) is in the side nav</span>`,
  sync:`<span class="xsmall muted">An editor (Tom) sees the same while Editing</span>`,

/* ================= render & behavior ================= */
(function(){
  const stage=document.getElementById('stage');
  stage.innerHTML=SCREENS.map(([id,g,name,desc])=>`<section data-screen="${id}" aria-label="${name}" hidden>${id==='index'?'':`<div class="cap"><b>${name}</b><span>${g}</span><code>#${id}</code><span class="hide-md">${desc}</span>${CAPACTS[id]?`<span class="cap-acts">${CAPACTS[id]}</span>`:''}</div>`}${R[id]()}</section>`).join('');
  const sel=document.getElementById('screen-select');
  sel.innerHTML=`<option value="index">Index</option>`+GROUPS.map(g=>`<optgroup label="${g}">${SCREENS.filter(s=>s[1]===g).map(s=>`<option value="${s[0]}">${s[2]}</option>`).join('')}</optgroup>`).join('');
  const ids=SCREENS.map(s=>s[0]);
  const count=document.getElementById('screen-count');
  function current(){const h=location.hash.slice(1);return ids.includes(h)?h:'index'}
  function show(){
    const id=current();
    stage.querySelectorAll(':scope > section').forEach(s=>{s.hidden=s.dataset.screen!==id});
    sel.value=id;const i=ids.indexOf(id);count.textContent=i?`${i} / ${ids.length-1}`:'';
    closeMenus();window.scrollTo(0,0);
  }
  function go(id){if(location.hash!=='#'+id)location.hash=id;else show()}
  window.addEventListener('hashchange',show);
  sel.addEventListener('change',()=>go(sel.value));
  document.getElementById('prev-btn').addEventListener('click',()=>{const i=ids.indexOf(current());go(ids[(i-1+ids.length)%ids.length])});
  document.getElementById('next-btn').addEventListener('click',()=>{const i=ids.indexOf(current());go(ids[(i+1)%ids.length])});
  /* theme */
  const root=document.documentElement,tb=document.getElementById('theme-btn');
  const eff=()=>root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const paintBtn=()=>{tb.innerHTML=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${eff()==='dark'?I.sun:I.moon}</svg>`;document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-selected',String((root.dataset.theme||'system')===b.dataset.themeSet)))};
  function setTheme(t){if(t==='system')delete root.dataset.theme;else root.dataset.theme=t;try{localStorage.setItem('kmdn-mock-theme',t)}catch(e){}paintBtn()}
  try{const t=localStorage.getItem('kmdn-mock-theme');if(t)setTheme(t)}catch(e){}
  tb.addEventListener('click',()=>setTheme(eff()==='dark'?'light':'dark'));
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintBtn)}catch(e){}
  paintBtn();
  /* toasts */
  const toasts=document.getElementById('toasts');
  function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`${ic('ccheck')}<div class="tt">${esc(msg)}</div>`;toasts.appendChild(t);setTimeout(()=>t.remove(),3200)}
  function closeMenus(except){document.querySelectorAll('.menu:not([hidden])').forEach(m=>{if(m!==except){m.hidden=true;const b=document.querySelector(`[data-menu="${m.id}"]`);if(b)b.setAttribute('aria-expanded','false')}})}
  const byId=id=>document.getElementById(id);
  document.addEventListener('click',e=>{
    const gn=e.target.closest('.gn[data-t]');if(gn){const w=gn.closest('.gwrap');const pop=w&&w.querySelector('.gpop');if(pop){const r=gn.getBoundingClientRect(),wr=w.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left-wr.left+w.scrollLeft+18,w.scrollWidth-262))+'px';pop.style.top=(r.top-wr.top+w.scrollTop+18)+'px';['t','p','in','out'].forEach(k=>{const f=pop.querySelector(`[data-f="${k}"]`);if(f)f.textContent=gn.dataset[k]});pop.hidden=false}return}
    if(e.target.closest('[data-gpop-close]')){const p=e.target.closest('.gpop');if(p)p.hidden=true;return}
    const cons=e.target.closest('.cons');if(cons&&!e.target.closest('.cons-card'))cons.classList.toggle('pin');
    const t=e.target.closest('[data-ctoggle],[data-setlabel],[data-menu],[data-tab],[data-open],[data-close],[data-toggle],[data-swap],[data-panel-toggle],[data-panel-toggle-screen],[data-sidebar-toggle],[data-toast],[data-theme-set],[data-go],[data-radio],.switch,.cb,.tab,.utab,.snav button');
    const menuEl=e.target.closest('.menu');
    if(!t||!t.dataset.menu)closeMenus(menuEl||undefined);
    if(!t)return;
    const sec=t.closest('section')||document;
    if(t.dataset.menu){e.preventDefault();const m=byId(t.dataset.menu);const open=m.hidden;closeMenus();m.hidden=!open;t.setAttribute('aria-expanded',String(open));return}
    if(t.dataset.tab){const [set]=t.dataset.tab.split(':');
      sec.querySelectorAll(`[data-tab^="${set}:"]`).forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t.dataset.tab)));
      sec.querySelectorAll(`[data-tabpanel^="${set}:"]`).forEach(p=>{p.hidden=p.dataset.tabpanel!==t.dataset.tab});}
    else if((t.classList.contains('tab')||t.classList.contains('utab')||t.matches('.snav button'))&&!t.dataset.go&&!t.dataset.themeSet){const p=t.parentElement;p.querySelectorAll(':scope > [aria-selected]').forEach(b=>b.setAttribute('aria-selected',String(b===t)))}
    if(t.dataset.radio!==undefined&&t.hasAttribute('data-radio')){const g=t.closest('[role="radiogroup"]')||t.parentElement;g.querySelectorAll('[data-radio]').forEach(b=>{b.setAttribute('aria-checked',String(b===t))})}
    if(t.classList.contains('switch')&&!t.dataset.go&&!t.disabled)t.setAttribute('aria-checked',String(t.getAttribute('aria-checked')!=='true'));
    if(t.classList.contains('cb'))t.setAttribute('aria-checked',String(t.getAttribute('aria-checked')!=='true'));
    if(t.dataset.setlabel){const d=t.closest('.dd');const l=d&&d.querySelector('[data-label]');if(l)l.textContent=t.dataset.setlabel;closeMenus()}
    if(t.dataset.ctoggle){const [c,s]=t.dataset.ctoggle.split('|');const el=s?(t.closest(s)||sec.querySelector(s)):t.closest('article');if(el)el.classList.toggle(c)}
    if(t.dataset.toggle&&t.hasAttribute('aria-expanded'))t.setAttribute('aria-expanded',String(t.getAttribute('aria-expanded')!=='true'));
    if(t.dataset.open){e.preventDefault();const o=byId(t.dataset.open);if(o){o.hidden=false;const f=o.querySelector('input,textarea,button:not(.x)');if(f)f.focus({preventScroll:true})}}
    if(t.dataset.toggle){const o=byId(t.dataset.toggle);if(o)o.hidden=!o.hidden}
    if(t.dataset.swap){const [s,h]=t.dataset.swap.split(',');const a=byId(s),b=byId(h);if(a)a.hidden=false;if(b)b.hidden=true}
    if(t.hasAttribute('data-panel-toggle')){const a=t.closest('.app');if(a)a.classList.toggle('rp-closed')}
    if(t.hasAttribute('data-panel-toggle-screen')){const a=sec.querySelector('.app');if(a)a.classList.toggle('rp-closed')}
    if(t.hasAttribute('data-sidebar-toggle')){const a=t.closest('.app');if(a)a.classList.toggle('side-open')}
    if(t.hasAttribute('data-close')){const o=t.dataset.close?byId(t.dataset.close):t.closest('.overlay');if(o)o.hidden=true}
    if(t.dataset.themeSet){setTheme(t.dataset.themeSet)}
    if(t.dataset.toast)toast(t.dataset.toast);
    if(t.dataset.go){e.preventDefault();go(t.dataset.go)}
  });
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('search');return}
    if(e.key==='Escape'){
      const open=document.querySelector('.menu:not([hidden])');if(open){closeMenus();return}
      if(current()==='search'){go('doc-published');return}
      const sec=document.querySelector(`section[data-screen="${current()}"]`);
      const ovs=sec?[...sec.querySelectorAll('.overlay:not([hidden])')]:[];if(ovs.length)ovs[ovs.length-1].hidden=true;
    }
  });
  show();
})();
</script>
