openapi: 3.1.0
info:
  title: kmdn API
  version: 0.1.0
  description: |
    REST API of the kmdn server. Paths are relative to `/api/v1`.

    Browser clients authenticate with the `kmdn_session` cookie. Unsafe
    methods (POST, PUT, PATCH, DELETE) must send the `X-Kmdn-CSRF` header with
    the value of the `kmdn_csrf` cookie (also returned as `csrf_token` by
    `GET /me`). Errors use RFC 9457 problem details with a stable `code`.
  license:
    name: AGPL-3.0
servers:
  - url: /api/v1
tags:
  - name: repos
  - name: people
  - name: auth
  - name: me
  - name: setup
  - name: admin
  - name: revisions
  - name: links
  - name: threads
  - name: notifications
  - name: assistant
paths:
  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Email a sign-in link and code
      description: Always answers 202 for a valid address, whether or not an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Sent (if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in_minutes]
                properties:
                  status: { type: string, enum: [sent] }
                  expires_in_minutes: { type: integer }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Sign in with a link token, or an email and 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token: { type: string }
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9 ]{6,7}$" }
      responses:
        "200":
          description: Signed in; session cookies set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/passkey/options:
    post:
      tags: [auth]
      operationId: passkeySignInOptions
      summary: Start a passkey sign-in (discoverable credentials, no email)
      responses:
        "200": { description: WebAuthn request options, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/passkey/verify:
    post:
      tags: [auth]
      operationId: passkeySignIn
      summary: Finish a passkey sign-in; session cookies set
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyResponse" } } }
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out }
  /me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                theme: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "422": { $ref: "#/components/responses/Problem" }
  /me/passkeys:
    get:
      tags: [auth]
      operationId: listPasskeys
      responses:
        "200":
          description: The caller's passkeys
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Passkey" } } } } } }
  /me/passkeys/register/options:
    post:
      tags: [auth]
      operationId: passkeyRegisterOptions
      summary: Start adding a passkey
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 60 } } } } }
      responses:
        "200": { description: WebAuthn creation options, content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyCeremony" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /me/passkeys/register/verify:
    post:
      tags: [auth]
      operationId: passkeyRegister
      summary: Finish adding a passkey
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasskeyResponse" } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /me/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [auth]
      operationId: renamePasskey
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 60 } } } } }
      responses:
        "204": { description: Renamed }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [auth]
      operationId: deletePasskey
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
  /me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeMySession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/admin:
    post:
      tags: [setup]
      operationId: createFirstAdmin
      security: []
      description: Creates the first instance admin using the one-time token printed in the server log, and signs them in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, email]
              additionalProperties: false
              properties:
                token: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                instance_name: { type: string }
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /setup/complete:
    post:
      tags: [setup]
      operationId: completeSetup
      responses:
        "200":
          description: Setup marked complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/smtp:
    get:
      tags: [admin]
      operationId: getSMTP
      responses:
        "200":
          description: Current SMTP settings (password never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPSettings" }
    put:
      tags: [admin]
      operationId: putSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPSettings" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/smtp/test:
    post:
      tags: [admin]
      operationId: testSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to: { type: string, format: email }
                settings: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: Result of the delivery attempt
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  to: { type: string }
                  error: { type: string }
                  hint: { type: string }
  /repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: Repositories the caller can see, with their role
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RepoView" } }
    post:
      tags: [repos]
      operationId: connectRepo
      summary: Connect a repository (instance admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepoInput" }
      responses:
        "202":
          description: Connected; the first sync runs as a job
          content:
            application/json:
              schema:
                type: object
                required: [repo, job_id]
                properties:
                  repo: { $ref: "#/components/schemas/RepoView" }
                  job_id: { type: string }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/by-slug/{owner}/{name}:
    get:
      tags: [repos]
      operationId: getRepoBySlug
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Repository, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepo
      responses:
        "200": { description: Repository, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repos]
      operationId: updateRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepoInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repos]
      operationId: disconnectRepo
      responses:
        "204": { description: Disconnected (the forge repository is untouched) }
  /repos/{repo}/refresh:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [repos]
      operationId: refreshRepo
      responses:
        "202": { description: Sync scheduled, content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
  /repos/{repo}/tree:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoTree
      summary: Files in the content scope at the published head
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required: [head_sha, root, items]
                properties:
                  head_sha: { type: string }
                  root: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
  /repos/{repo}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: sha, in: query, schema: { type: string }, description: Commit to read at (default published head) }
    get:
      tags: [repos]
      operationId: getRepoFile
      responses:
        "200": { description: File, content: { application/json: { schema: { $ref: "#/components/schemas/RepoFile" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/raw/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: sha, in: query, schema: { type: string } }
    get:
      tags: [repos]
      operationId: getRawFile
      summary: File bytes for images, PDFs and markdown (sandboxed)
      responses:
        "200": { description: File content with a type fixed by extension }
        "304": { description: Not modified }
        "415": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/activity:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoActivity
      summary: Recent published changes to pages in scope
      responses:
        "200":
          description: Commits with the pages they changed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Commit"
                        - type: object
                          required: [paths]
                          properties: { paths: { type: array, items: { type: string } } }
  /repos/{repo}/history/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
    get:
      tags: [repos]
      operationId: getFileHistory
      summary: Published versions of a file (follows renames)
      responses:
        "200":
          description: Commits, newest first
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Commit" } } } }
  /repos/{repo}/blame/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [repos]
      operationId: getFileBlame
      responses:
        "200":
          description: Per-line attribution
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/BlameLine" } } } }
  /repos/{repo}/search:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: q, in: query, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
    get:
      tags: [repos]
      operationId: searchRepo
      summary: Full-text search over published pages
      description: Matched terms in `snippet` are wrapped in U+0002 … U+0003.
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } }
  /repos/{repo}/webhook:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoWebhook
      summary: Where to send push events (plain git and GitLab)
      responses:
        "200":
          description: Webhook endpoint and secret
          content:
            application/json:
              schema: { type: object, required: [url, secret, header], properties: { url: { type: string }, secret: { type: string }, header: { type: string } } }
  /repos/{repo}/members:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: listRepoMembers
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } }
  /repos/{repo}/members/{type}/{id}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: type, in: path, required: true, schema: { type: string, enum: [user, group] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [repos]
      operationId: setRepoMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } }
      responses:
        "200":
          description: Updated grants
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } }
    delete:
      tags: [repos]
      operationId: removeRepoMember
      responses:
        "204": { description: Removed }
  /admin/forges:
    get:
      tags: [admin]
      operationId: listForges
      responses:
        "200":
          description: Forge hosts
          content:
            application/json:
              schema:
                type: object
                required: [items, gitlab_callback_url]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ForgeHost" } }
                  gitlab_callback_url: { type: string, description: "Redirect URI to register in a GitLab OAuth application (the same for every GitLab host)" }
    post:
      tags: [admin]
      operationId: createForge
      summary: Add a GitLab host or a plain git host (GitHub uses the manifest flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [gitlab, git] }
                base_url: { type: string }
                display_name: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ForgeHost" } } } }
  /admin/forges/{id}:
    delete:
      tags: [admin]
      operationId: deleteForge
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/forges/github/manifest:
    post:
      tags: [admin]
      operationId: githubManifest
      summary: Start the GitHub App manifest flow
      description: The browser then POSTs a form with field `manifest` to `action_url`; GitHub redirects back to /admin/forges/github/callback.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string, description: "GitHub web URL; empty for github.com" }
                organization: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Form target and manifest
          content:
            application/json:
              schema: { type: object, required: [action_url, manifest], properties: { action_url: { type: string }, manifest: { type: string } } }
  /admin/forges/github/callback:
    get:
      tags: [admin]
      operationId: githubCallback
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirects to the App installation page }
  /admin/forges/{id}/installations:
    get:
      tags: [admin]
      operationId: listGitHubInstallations
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Installations of the App
          content:
            application/json:
              schema:
                type: object
                required: [items, install_url]
                properties:
                  items: { type: array, items: { type: object, properties: { external_id: { type: string }, account_login: { type: string } } } }
                  install_url: { type: string }
  /admin/forges/{id}/repositories:
    get:
      tags: [admin]
      operationId: listInstallationRepos
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: installation, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Repositories the installation can access
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ForgeRepoInfo" } } } }
  /users:
    get:
      tags: [people]
      operationId: searchUsers
      summary: Find active users by name or email (member pickers)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Up to 20 users
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserRef" } } } }
  /groups:
    get:
      tags: [people]
      operationId: listGroupsPublic
      summary: Groups (for granting repository roles)
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } }
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, deactivated] } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
  /admin/users/{id}:
    patch:
      tags: [admin]
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_instance_admin: { type: boolean }
                status: { type: string, enum: [active, deactivated] }
                name: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [admin]
      operationId: revokeUserSessions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Sessions revoked }
  /admin/groups:
    get:
      tags: [admin]
      operationId: listGroups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } }
    post:
      tags: [admin]
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
    delete:
      tags: [admin]
      operationId: deleteGroup
      responses:
        "204": { description: Deleted (its repository grants are removed too) }
  /admin/groups/{id}/members:
    get:
      tags: [admin]
      operationId: listGroupMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
  /admin/groups/{id}/members/{user}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: addGroupMember
      responses:
        "200":
          description: Members after adding
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
    delete:
      tags: [admin]
      operationId: removeGroupMember
      responses:
        "204": { description: Removed }
  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Audit log entries, newest first, 100 at a time
      parameters:
        - { $ref: "#/components/parameters/AuditActorType" }
        - { $ref: "#/components/parameters/AuditActorID" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditRepo" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
        - { name: cursor, in: query, schema: { type: string }, description: "next_cursor from the previous page" }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: string }
                  actions: { type: array, items: { type: string }, description: "Every action recorded (first page only)" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/audit/export:
    get:
      tags: [admin]
      operationId: exportAudit
      summary: Every matching entry as a CSV or NDJSON download
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, ndjson] } }
        - { $ref: "#/components/parameters/AuditActorType" }
        - { $ref: "#/components/parameters/AuditActorID" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditRepo" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
      responses:
        "200":
          description: The export
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/agent-keys:
    get:
      tags: [admin]
      operationId: listAgentKeys
      summary: Agent keys for the MCP server, newest first, with 14 days of usage
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items, endpoint]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentKey" } }
                  endpoint: { type: string, description: "The MCP endpoint URL" }
    post:
      tags: [admin]
      operationId: createAgentKey
      summary: Create an agent key (the token is returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                all_repos: { type: boolean, description: "Every repo, including ones connected later" }
                repo_ids: { type: array, items: { type: string } }
                expires_in_days: { type: integer, enum: [0, 30, 90, 365], description: "0 never expires; default 90" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [key, token, config]
                properties:
                  key: { $ref: "#/components/schemas/AgentKey" }
                  token: { type: string, description: "kmdn_ak_… (shown once)" }
                  config: { type: string, description: "A ready-to-paste MCP client configuration" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/agent-keys/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: revokeAgentKey
      responses:
        "204": { description: Revoked }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/agent-keys/{id}/calls:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: listAgentKeyCalls
      summary: The key's latest 50 MCP calls (from the audit log)
      responses:
        "200":
          description: Calls
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } }
  /admin/system:
    get:
      tags: [admin]
      operationId: getSystem
      summary: Version, database, job queue (by kind and status) and failed jobs
      responses:
        "200":
          description: System
          content:
            application/json:
              schema:
                type: object
                required: [version, started_at, db, data_dir, repos, users, jobs, failed_jobs]
                properties:
                  version: { type: object, required: [version, commit, go], properties: { version: { type: string }, commit: { type: string }, date: { type: string }, go: { type: string } } }
                  started_at: { type: string, format: date-time }
                  db: { type: string, enum: [sqlite, postgres] }
                  data_dir: { type: string }
                  repos: { type: integer }
                  users: { type: integer }
                  jobs: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer } }, description: "kind → status (pending, running, failed) → count" }
                  failed_jobs:
                    type: array
                    items:
                      type: object
                      required: [id, kind, attempts, last_error, updated_at]
                      properties:
                        id: { type: string }
                        kind: { type: string }
                        attempts: { type: integer }
                        last_error: { type: string }
                        updated_at: { type: string, format: date-time }
  /admin/system/doctor:
    get:
      tags: [admin]
      operationId: runDoctor
      summary: The doctor's checks, including network reachability (SMTP, forges, AI provider)
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema:
                type: object
                required: [checks]
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status, detail]
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [ok, warn, fail] }
                        detail: { type: string }
  /admin/jobs/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: retryJob
      summary: Put a failed job back in the queue
      responses:
        "204": { description: Queued }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/invites:
    post:
      tags: [admin]
      operationId: inviteUser
      summary: Invite someone to the instance, optionally with a repository role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                repo_id: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Invited or granted, content: { application/json: { schema: { $ref: "#/components/schemas/InviteResult" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/invites:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [repos]
      operationId: inviteToRepo
      summary: Invite someone to a repository (repository admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Invited, or granted directly for an existing account, content: { application/json: { schema: { $ref: "#/components/schemas/InviteResult" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /invites/{token}:
    get:
      tags: [people]
      operationId: getInvite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invite details, content: { application/json: { schema: { $ref: "#/components/schemas/InviteDetails" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /invites/{token}/accept:
    post:
      tags: [people]
      operationId: acceptInvite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "200": { description: Accepted and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /auth/oauth/providers:
    get:
      tags: [auth]
      operationId: listOAuthProviders
      security: []
      responses:
        "200":
          description: Forges people can sign in with
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [id, kind, display_name], properties: { id: { type: string }, kind: { type: string }, display_name: { type: string } } } }
  /auth/oauth/{host}/start:
    get:
      tags: [auth]
      operationId: startOAuth
      security: []
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [signin, link] } }
        - { name: redirect, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the forge }
  /auth/oauth/{host}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      security: []
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to kmdn, signed in or linked (errors in query string) }
  /auth/oauth/callback:
    get:
      tags: [auth]
      operationId: oauthCallbackGitLab
      summary: GitLab's OAuth callback, one URL for every GitLab host (the state names the host)
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to kmdn, signed in or linked (errors in query string) }
  /me/linked-accounts:
    get:
      tags: [me]
      operationId: listLinkedAccounts
      responses:
        "200":
          description: Linked forge accounts
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LinkedAccount" } } } }
  /me/linked-accounts/{id}:
    delete:
      tags: [me]
      operationId: unlinkAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Unlinked }
  /me/commit-email:
    put:
      tags: [me]
      operationId: setCommitEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [forge_noreply, account, custom] }
                custom: { type: string, format: email }
      responses:
        "204": { description: Saved }
  /repos/{repo}/revisions:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [revisions]
      operationId: listRevisions
      summary: Revisions, most recently updated first
      parameters:
        - { name: state, in: query, schema: { type: string }, description: "open (default), all, or comma-separated states" }
        - { name: mine, in: query, schema: { type: boolean }, description: Only revisions the caller edits }
        - { name: reviewing, in: query, schema: { type: boolean }, description: "Only revisions in review that ask the caller to review and that they haven't approved this round" }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionView" } }
    post:
      tags: [revisions]
      operationId: createRevision
      summary: Start a revision on the published head
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevisionCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/revisions/by-number/{number}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: number, in: path, required: true, schema: { type: integer } }
    get:
      tags: [revisions]
      operationId: getRevisionByNumber
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/templates:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [revisions]
      operationId: listTemplates
      summary: Page templates in .kmdn/templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
  /revisions/{revision}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [revisions]
      operationId: updateRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/close:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: closeRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/reopen:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: reopenRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/tree:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevisionTree
      summary: The base tree with the revision's file changes applied
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required: [base_sha, root, items]
                properties:
                  base_sha: { type: string }
                  root: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionTreeNode" } }
  /revisions/{revision}/files:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionFiles
      summary: The manifest
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionFile" } }
    post:
      tags: [revisions]
      operationId: revisionFileOp
      summary: Add, modify, rename or delete a page
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevisionFileOp" } } }
      responses:
        "200": { description: Manifest entry, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionFile" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getRevisionFile
      summary: A page as seen in the revision
      responses:
        "200": { description: Content, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionContent" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/members:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionMember" } }
  /revisions/{revision}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [revisions]
      operationId: addRevisionMember
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionMember" } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [revisions]
      operationId: removeRevisionMember
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/events:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionEvents
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionEvent" } }
  /revisions/{revision}/checkpoints:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listCheckpoints
      summary: Checkpoints, newest first
      responses:
        "200":
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }
  /revisions/{revision}/save:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: saveRevision
      summary: Save all
      description: >-
        Commits the revision's current content on its branch, authored by the caller, pushes it to
        the pull/merge request and records the commit as a checkpoint. 409 nothing_to_save when the
        content is what the last save committed; 409 branch_moved when someone pushed to the branch
        outside kmdn; 502 when the forge can't be reached.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { message: { type: string, description: "Commit message; empty names the changed pages" } } }
      responses:
        "201": { description: Checkpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Checkpoint" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/files:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
    get:
      tags: [revisions]
      operationId: listCheckpointFiles
      responses:
        "200":
          description: Files at the checkpoint (without content)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CheckpointFile" } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getCheckpointFile
      responses:
        "200": { description: File, content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointFile" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/restore:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
    post:
      tags: [revisions]
      operationId: restoreCheckpoint
      summary: Bring the revision back to a checkpoint, as a new change
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/assets:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionAssets
      responses:
        "200":
          description: Images the revision adds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionAsset" } }
    post:
      tags: [revisions]
      operationId: uploadRevisionAsset
      summary: Upload an image next to a page
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, page]
              properties:
                file: { type: string, format: binary }
                page: { type: string, description: The page the image is inserted into }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/UploadResult" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/raw/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getRevisionRaw
      summary: An image as the revision sees it (uploads, then the base)
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/links/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [links]
      operationId: getPageLinks
      summary: A published page's outgoing links (checked) and backlinks
      responses:
        "200": { description: Links, content: { application/json: { schema: { $ref: "#/components/schemas/PageLinks" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/links/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [links]
      operationId: getRevisionPageLinks
      summary: A page's links as the revision sees it
      responses:
        "200": { description: Links, content: { application/json: { schema: { $ref: "#/components/schemas/PageLinks" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checks:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [links]
      operationId: getRevisionChecks
      summary: Broken links in changed pages, and published links the revision would break
      responses:
        "200": { description: Checks, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionChecks" } } } }
  /revisions/{revision}/files/rename-preview:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [links]
      operationId: renamePreview
      summary: Link changes a move needs (inbound links and the page's own relative links)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MoveInput" } } }
      responses:
        "200":
          description: Rewrites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LinkRewrite" } }
  /revisions/{revision}/links/rewrite:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [links]
      operationId: rewriteLinks
      summary: Update links after a page moved (adds linking pages to the revision)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MoveInput" } } }
      responses:
        "200":
          description: Pages changed
          content: { application/json: { schema: { type: object, required: [pages], properties: { pages: { type: integer } } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/presence:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevisionPresence
      summary: Who has pages of the revision open (updates arrive as "presence" events)
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PresenceUser" } }
  /revisions/{revision}/updates:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevisionUpdate
      summary: The pending update from Published (null when there is none)
      responses:
        "200":
          description: Pending update and whether the caller can apply it
          content:
            application/json:
              schema:
                type: object
                required: [update, can_apply]
                properties:
                  update:
                    oneOf:
                      - { $ref: "#/components/schemas/RevisionUpdate" }
                      - { type: "null" }
                  can_apply: { type: boolean }
  /revisions/{revision}/updates/{update}/apply:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: update, in: path, required: true, schema: { type: string } }
    post:
      tags: [revisions]
      operationId: applyRevisionUpdate
      summary: Apply the pending update (checkpoint, merge into each page, move the base)
      responses:
        "200":
          description: What applying did
          content:
            application/json:
              schema:
                type: object
                required: [files, conflicts, reopened]
                properties:
                  files: { type: integer }
                  conflicts: { type: integer }
                  reopened: { type: boolean, description: "Sent back to Editing because of conflicts" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/conflicts/resolve:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: resolvePageConflict
      summary: Settle a page Published deleted while the revision edits it (keep or accept the deletion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, choice]
              properties:
                path: { type: string }
                choice: { type: string, enum: [keep, delete] }
      responses:
        "204": { description: Resolved }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/suggestions:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listSuggestions
      summary: Pending suggestions in the revision's pages (or one page)
      parameters:
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: Suggestions in manifest and document order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
  /revisions/{revision}/suggestions/resolve:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: resolveSuggestions
      summary: Accept or reject suggestions in a page (by id, by author, or all)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, action]
              properties:
                path: { type: string }
                action: { type: string, enum: [accept, reject] }
                ids: { type: array, items: { type: string } }
                author: { type: string, description: "Only this author's suggestions" }
      responses:
        "200":
          description: How many were resolved
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/sourcemap/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getSourceMap
      summary: The source map of a page's collaborative document (for source mode)
      responses:
        "200": { description: Source map (doc engine format), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "204": { description: The page has no document yet }
  /revisions/{revision}/submit:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: submitRevision
      summary: Send for review (at least one reviewer)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SubmitInput" } } }
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/withdraw:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: withdrawRevision
      summary: Back to Editing (approvals dismissed)
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/approve:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: approveRevision
      summary: Approve the current content (assigned reviewers)
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/request-changes:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: requestChanges
      summary: Back to Editing with a note
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/reviewers:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listReviewers
      responses:
        "200":
          description: Reviewers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Reviewer" } }
  /revisions/{revision}/reviewers/{user}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [revisions]
      operationId: addReviewer
      responses:
        "200":
          description: Reviewers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Reviewer" } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [revisions]
      operationId: removeReviewer
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/reviewer-suggestions:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: reviewerSuggestions
      summary: Maintainers who can review, suggested ones first
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReviewerCandidate" } }
  /revisions/{revision}/commit-preview:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: title, in: query, schema: { type: string } }
      - { name: body, in: query, schema: { type: string } }
    get:
      tags: [revisions]
      operationId: commitPreview
      summary: The commit publishing would make (message, co-authors, reviewers)
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/CommitPreview" } } } }
  /revisions/{revision}/publish:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: publishRevision
      summary: Publish an approved revision (a job; a pull/merge request on protected branches)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { title: { type: string }, body: { type: string } } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, required: [job_id], properties: { job_id: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/diff/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: context, in: query, schema: { type: integer } }
    get:
      tags: [revisions]
      operationId: getRevisionDiff
      summary: A changed page against the revision's base (source diff hunks)
      responses:
        "200": { description: Diff, content: { application/json: { schema: { $ref: "#/components/schemas/FileDiff" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/threads:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [threads]
      operationId: listRevisionThreads
      parameters:
        - { name: path, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [hot, updated] } }
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Thread" } }
    post:
      tags: [threads]
      operationId: createRevisionThread
      summary: Start a thread on a passage (the client stores its Yjs anchor in the page's document)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThreadCreate" } } }
      responses:
        "201": { description: Thread, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /assistant/status:
    get:
      tags: [assistant]
      operationId: getAssistantStatus
      summary: Whether the assistant is available on this instance
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, consistency]
                properties:
                  enabled: { type: boolean }
                  consistency: { type: boolean, description: "Consistency checks are available (an embeddings model is set up too)" }
  /repos/{repo}/assistant/threads:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [assistant]
      operationId: listAssistantThreads
      summary: The caller's private Q&A conversations in this repository
      responses:
        "200":
          description: Threads, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AssistantThread" } }
    post:
      tags: [assistant]
      operationId: createAssistantThread
      summary: Ask a question in a new private conversation (the answer streams on the assistant:<thread> scope)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssistantPost" } } }
      responses:
        "201":
          description: The thread and the question
          content:
            application/json:
              schema:
                type: object
                required: [thread, message]
                properties:
                  thread: { $ref: "#/components/schemas/AssistantThread" }
                  message: { $ref: "#/components/schemas/AssistantMessage" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /assistant/threads/{thread}:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
    get:
      tags: [assistant]
      operationId: getAssistantThread
      responses:
        "200":
          description: The thread, its messages, and whether a run is in progress
          content:
            application/json:
              schema:
                type: object
                required: [thread, messages, running]
                properties:
                  thread: { $ref: "#/components/schemas/AssistantThread" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } }
                  running: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [assistant]
      operationId: deleteAssistantThread
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
  /assistant/threads/{thread}/messages:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
    post:
      tags: [assistant]
      operationId: postAssistantMessage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssistantPost" } } }
      responses:
        "202":
          description: Posted; a run starts (or is queued behind the current one)
          content:
            application/json:
              schema:
                type: object
                required: [message, queued]
                properties:
                  message: { $ref: "#/components/schemas/AssistantMessage" }
                  queued: { type: boolean }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/review-summary:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [assistant]
      operationId: getReviewSummary
      summary: Checks on the revision's pages (always fresh) and the review assistant's summary card
      responses:
        "200":
          description: Checks and summary
          content:
            application/json:
              schema:
                type: object
                required: [checks, review, pending, available]
                properties:
                  checks: { type: array, items: { $ref: "#/components/schemas/ReviewFinding" } }
                  review:
                    oneOf:
                      - { $ref: "#/components/schemas/ReviewSummary" }
                      - { type: "null" }
                  pending: { type: boolean, description: "A summary is being written" }
                  available: { type: boolean, description: "The assistant is set up" }
    post:
      tags: [assistant]
      operationId: requestReviewSummary
      summary: Ask for a fresh summary (editors and reviewers)
      responses:
        "202": { description: Queued }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/change-summaries:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [assistant]
      operationId: getChangeSummaries
      summary: One-line summaries of a page's published changes, by commit
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: object
                required: [by_commit]
                properties:
                  by_commit: { type: object, additionalProperties: { type: string } }
  /revisions/{revision}/consistency:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [assistant]
      operationId: getRevisionConsistency
      summary: Contradictions and duplicates between the revision's changed passages and the rest of the repo
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: object
                required: [available, pending, findings]
                properties:
                  available: { type: boolean, description: "An AI provider and an embeddings model are set up" }
                  pending: { type: boolean, description: "A check is queued or running" }
                  findings: { type: array, items: { $ref: "#/components/schemas/ConsistencyFinding" } }
    post:
      tags: [assistant]
      operationId: runRevisionConsistency
      summary: Check the revision now (editors and reviewers)
      responses:
        "202": { description: Queued }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/consistency:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [assistant]
      operationId: getConsistencyReport
      summary: The repo's consistency report (from the latest scans)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, ignored, closed] } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                required: [available, pending, can_run, can_fix, scan, findings]
                properties:
                  available: { type: boolean }
                  pending: { type: boolean, description: "A scan is queued or running" }
                  can_run: { type: boolean, description: "The caller can run a scan (maintainers)" }
                  can_fix: { type: boolean, description: "The caller can ignore findings and start revisions" }
                  scan:
                    oneOf:
                      - { $ref: "#/components/schemas/ConsistencyScan" }
                      - { type: "null" }
                  findings: { type: array, items: { $ref: "#/components/schemas/ConsistencyFinding" } }
  /repos/{repo}/consistency/scan:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [assistant]
      operationId: runConsistencyScan
      summary: Scan the repo now (maintainers)
      responses:
        "202": { description: Queued }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /consistency/findings/{finding}/ignore:
    parameters:
      - { name: finding, in: path, required: true, schema: { type: string } }
    post:
      tags: [assistant]
      operationId: ignoreConsistencyFinding
      summary: Ignore the pair, with a reason (remembered until either passage changes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "204": { description: Ignored }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [assistant]
      operationId: unignoreConsistencyFinding
      summary: Stop ignoring the pair
      responses:
        "204": { description: No longer ignored }
        "403": { $ref: "#/components/responses/Problem" }
  /consistency/findings/{finding}/fix:
    parameters:
      - { name: finding, in: path, required: true, schema: { type: string } }
    post:
      tags: [assistant]
      operationId: fixConsistencyFinding
      summary: Ask the assistant to fix a finding (in its revision; from the report, in a new revision touching both pages)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [fix, link], description: "link replaces a duplicate with a link to the other page" }
      responses:
        "201":
          description: Revision started (report findings)
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { $ref: "#/components/schemas/Revision" }
        "202":
          description: The revision's assistant is on it
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { $ref: "#/components/schemas/Revision" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/assistant:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [assistant]
      operationId: getRevisionAssistant
      summary: The revision's shared assistant thread (created on first use) and whether the caller can prompt
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                type: object
                required: [thread, messages, running, can_prompt]
                properties:
                  thread: { $ref: "#/components/schemas/AssistantThread" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AssistantMessage" } }
                  running: { type: boolean }
                  can_prompt: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
  /assistant/threads/{thread}/proposals/{call}/accept:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
      - { name: call, in: path, required: true, schema: { type: string } }
    post:
      tags: [assistant]
      operationId: acceptAssistantProposal
      summary: Carry out a proposal (Q&A starts the revision and moves the conversation; in a revision thread it applies a rename or delete)
      responses:
        "200":
          description: The file operation was applied
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/AssistantMessage" }
        "201":
          description: The revision and its shared thread
          content:
            application/json:
              schema:
                type: object
                required: [revision, thread]
                properties:
                  revision: { $ref: "#/components/schemas/Revision" }
                  thread: { $ref: "#/components/schemas/AssistantThread" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /admin/ai:
    get:
      tags: [admin]
      operationId: getAISettings
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AISettings" } } } }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: putAISettings
      summary: Configure the AI provider (runs a capability check)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: ["", anthropic, openai] }
                base_url: { type: string }
                api_key: { type: string, description: "Omit to keep the current key; empty to remove it" }
                models: { type: object, additionalProperties: { type: string } }
                embeddings:
                  type: object
                  properties:
                    base_url: { type: string }
                    model: { type: string }
                    api_key: { type: string }
                user_daily_tokens: { type: integer }
                instance_monthly_tokens: { type: integer }
                consistency:
                  type: object
                  properties:
                    scan_every_days: { type: integer }
                    scan_max_calls: { type: integer }
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AISettings" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/ai/check:
    post:
      tags: [admin]
      operationId: checkAIProvider
      responses:
        "200": { description: Settings with a fresh check, content: { application/json: { schema: { $ref: "#/components/schemas/AISettings" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/ai/usage:
    get:
      tags: [admin]
      operationId: getAIUsage
      responses:
        "200":
          description: Tokens today and this month, by user and by task
          content:
            application/json:
              schema:
                type: object
                required: [today_tokens, month_tokens, by_user, by_task]
                properties:
                  today_tokens: { type: integer }
                  month_tokens: { type: integer }
                  by_user: { type: array, items: { $ref: "#/components/schemas/AIUsageRow" } }
                  by_task: { type: array, items: { $ref: "#/components/schemas/AIUsageRow" } }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's inbox, newest first
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Notifications and the unread count
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer }
  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
                all: { type: boolean }
      responses:
        "204": { description: Marked read }
        "422": { $ref: "#/components/responses/Problem" }
  /me/notification-prefs:
    get:
      tags: [notifications]
      operationId: getNotificationPrefs
      responses:
        "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
    put:
      tags: [notifications]
      operationId: putNotificationPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { $ref: "#/components/schemas/NotificationPref" } }
      responses:
        "200": { description: Preferences, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPrefs" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /push/key:
    get:
      tags: [notifications]
      operationId: getPushKey
      summary: The instance's VAPID public key, for browsers to subscribe
      responses:
        "200":
          description: Key
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: { type: string }
        "404": { $ref: "#/components/responses/Problem" }
  /me/push-subscriptions:
    post:
      tags: [notifications]
      operationId: addPushSubscription
      summary: Receive browser pushes in this browser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscription" } } }
      responses:
        "204": { description: Subscribed }
        "422": { $ref: "#/components/responses/Problem" }
  /me/push-subscriptions/remove:
    post:
      tags: [notifications]
      operationId: removePushSubscription
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PushSubscription" } } }
      responses:
        "204": { description: Removed }
  /me/follows:
    get:
      tags: [notifications]
      operationId: listMyFollows
      responses:
        "200":
          description: Followed pages and folders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Follow" } }
  /repos/{repo}/follows:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: path, in: query, required: true, schema: { type: string } }
      - { name: folder, in: query, schema: { type: string, enum: ["true", "false"] } }
    get:
      tags: [notifications]
      operationId: getFollowState
      summary: Whether the caller follows a page, itself or through a folder
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } } }
    put:
      tags: [notifications]
      operationId: follow
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } } }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [notifications]
      operationId: unfollow
      responses:
        "200": { description: State, content: { application/json: { schema: { $ref: "#/components/schemas/FollowState" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/follows/updates:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [notifications]
      operationId: listFollowUpdates
      summary: Followed pages updated since the caller last read them
      responses:
        "200":
          description: Updates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FollowUpdate" } }
  /repos/{repo}/reads:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [notifications]
      operationId: recordPageRead
      summary: Note a read of a page at its latest commit; returns the previous read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, sha]
              properties:
                path: { type: string }
                sha: { type: string }
      responses:
        "200":
          description: The previous read (null the first time)
          content:
            application/json:
              schema:
                type: object
                required: [previous]
                properties:
                  previous:
                    oneOf:
                      - { $ref: "#/components/schemas/PageRead" }
                      - { type: "null" }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/hooks:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: listHooks
      summary: Outgoing webhooks (repository admins)
      responses:
        "200":
          description: Hooks and the events they can subscribe to
          content:
            application/json:
              schema:
                type: object
                required: [items, events]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hook" } }
                  events: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [repos]
      operationId: createHook
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HookInput" } } }
      responses:
        "201":
          description: The hook, and for generic hooks the signing secret (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [hook]
                properties:
                  hook: { $ref: "#/components/schemas/Hook" }
                  secret: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/hooks/{hook}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: hook, in: path, required: true, schema: { type: string } }
    patch:
      tags: [repos]
      operationId: updateHook
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HookInput" } } }
      responses:
        "200": { description: Hook, content: { application/json: { schema: { $ref: "#/components/schemas/Hook" } } } }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repos]
      operationId: deleteHook
      responses:
        "204": { description: Deleted }
  /repos/{repo}/hooks/{hook}/ping:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: hook, in: path, required: true, schema: { type: string } }
    post:
      tags: [repos]
      operationId: pingHook
      responses:
        "202": { description: A test delivery was queued }
  /repos/{repo}/hooks/{hook}/deliveries:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: hook, in: path, required: true, schema: { type: string } }
    get:
      tags: [repos]
      operationId: listHookDeliveries
      responses:
        "200":
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HookDelivery" } }
  /repos/{repo}/hooks/{hook}/deliveries/{delivery}/redeliver:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: hook, in: path, required: true, schema: { type: string } }
      - { name: delivery, in: path, required: true, schema: { type: string } }
    post:
      tags: [repos]
      operationId: redeliverHook
      responses:
        "202": { description: Queued again }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/graph:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [links]
      operationId: getLinkGraph
      summary: Pages and the links between them (published, or as a revision sees them)
      parameters:
        - { name: scope, in: query, schema: { type: string, description: "published (default) or revision:<id>" } }
      responses:
        "200": { description: Graph, content: { application/json: { schema: { $ref: "#/components/schemas/LinkGraph" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/discussions:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [threads]
      operationId: listDiscussions
      summary: Discussions on published pages (one page with path)
      parameters:
        - { name: path, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: sort, in: query, schema: { type: string, enum: [hot, updated] } }
      responses:
        "200":
          description: Discussions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Thread" } }
    post:
      tags: [threads]
      operationId: createDiscussion
      summary: Comment on a published page (anyone who can read the repository), anchored by quote
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ThreadCreate" } } }
      responses:
        "201": { description: Thread, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /threads/{thread}/fix-this:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
    post:
      tags: [threads]
      operationId: fixDiscussion
      summary: "Start a revision fixing a discussion (titled Fix: <page title>) and link them"
      responses:
        "201":
          description: The new revision
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { $ref: "#/components/schemas/Revision" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /threads/{thread}:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
    get:
      tags: [threads]
      operationId: getThread
      responses:
        "200": { description: Thread, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [threads]
      operationId: updateThread
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [state], properties: { state: { type: string, enum: [open, resolved] } } } } }
      responses:
        "200": { description: Thread, content: { application/json: { schema: { $ref: "#/components/schemas/Thread" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /threads/{thread}/comments:
    parameters:
      - { name: thread, in: path, required: true, schema: { type: string } }
    post:
      tags: [threads]
      operationId: replyToThread
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses:
        "201": { description: Comment, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /comments/{comment}:
    parameters:
      - { name: comment, in: path, required: true, schema: { type: string } }
    patch:
      tags: [threads]
      operationId: editComment
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses:
        "204": { description: Edited }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [threads]
      operationId: deleteComment
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
  /comments/{comment}/reactions/{kind}:
    parameters:
      - { name: comment, in: path, required: true, schema: { type: string } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: ["+1", check, eyes] } }
    put:
      tags: [threads]
      operationId: addReaction
      responses:
        "204": { description: Added }
    delete:
      tags: [threads]
      operationId: removeReaction
      responses:
        "204": { description: Removed }
components:
  parameters:
    RepoID:
      name: repo
      in: path
      required: true
      schema: { type: string }
    AuditActorType:
      { name: actor_type, in: query, schema: { type: string, enum: [user, system, agent_key, assistant] } }
    AuditActorID:
      { name: actor_id, in: query, schema: { type: string } }
    AuditAction:
      { name: action, in: query, schema: { type: string }, description: "An action, or a family ending in a dot (revision.)" }
    AuditRepo:
      { name: repo, in: query, schema: { type: string } }
    AuditFrom:
      { name: from, in: query, schema: { type: string, format: date }, description: "From this UTC day (inclusive)" }
    AuditTo:
      { name: to, in: query, schema: { type: string, format: date }, description: "Up to this UTC day (inclusive)" }
    RevisionID:
      name: revision
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: Repository-relative path; may contain slashes
      schema: { type: string }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kmdn_session
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    ReviewFinding:
      type: object
      required: [kind, path, message]
      properties:
        kind: { type: string, enum: [broken_link, breaks_inbound, missing_alt, heading_jump, frontmatter, style] }
        path: { type: string }
        line: { type: integer }
        message: { type: string }
        quote: { type: string }
    ReviewSummary:
      type: object
      required: [summary, commit_title, commit_body, findings, created_at, stale]
      properties:
        summary: { type: string }
        commit_title: { type: string }
        commit_body: { type: string }
        findings: { type: array, items: { $ref: "#/components/schemas/ReviewFinding" } }
        model: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        stale: { type: boolean, description: "The revision changed since it was written" }
    ConsistencySide:
      type: object
      required: [path, slug, heading, line, text]
      properties:
        path: { type: string }
        slug: { type: string }
        heading: { type: string }
        line: { type: integer }
        text: { type: string }
    ConsistencyFinding:
      type: object
      required: [id, kind, scope, a, b, explanation, similarity, status, first_seen, last_seen]
      properties:
        id: { type: string }
        kind: { type: string, enum: [contradiction, duplicate] }
        scope: { type: string, description: "published (the repo report) or the revision id" }
        a: { $ref: "#/components/schemas/ConsistencySide" }
        b: { $ref: "#/components/schemas/ConsistencySide" }
        claim_a: { type: string, description: "The conflicting claim, quoted from A" }
        claim_b: { type: string }
        explanation: { type: string }
        similarity: { type: number }
        status: { type: string, enum: [open, ignored, closed] }
        ignore_reason: { type: string }
        fix:
          type: object
          required: [id, number, title, state]
          properties:
            id: { type: string }
            number: { type: integer }
            title: { type: string }
            state: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
    ConsistencyScan:
      type: object
      required: [id, status, passages, candidates, judged, found, started_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, done, capped, error] }
        passages: { type: integer }
        candidates: { type: integer }
        judged: { type: integer }
        found: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    AssistantThread:
      type: object
      required: [id, repo_id, title, created_at, updated_at]
      properties:
        id: { type: string }
        repo_id: { type: string }
        revision_id: { type: string }
        owner_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantContext:
      type: object
      properties:
        path: { type: string }
        selection: { type: string }
    AssistantPost:
      type: object
      required: [text]
      properties:
        text: { type: string }
        context: { $ref: "#/components/schemas/AssistantContext" }
    AssistantMessage:
      type: object
      required: [id, role, parts, context, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        author_id: { type: string }
        author_name: { type: string }
        parts:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [text, tool, proposal, edit, file_op] }
              path: { type: string }
              to: { type: string }
              accepted: { type: boolean }
              text: { type: string }
              tool: { type: string }
              label: { type: string }
              call_id: { type: string }
              proposal:
                type: object
                required: [title, description, files]
                properties:
                  title: { type: string }
                  description: { type: string }
                  files: { type: array, items: { type: string } }
        context: { $ref: "#/components/schemas/AssistantContext" }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
    AISettings:
      type: object
      required: [provider, key_set, models, defaults, tasks, embeddings, user_daily_tokens, instance_monthly_tokens, consistency, disabled, managed]
      properties:
        provider: { type: string }
        base_url: { type: string }
        key_set: { type: boolean }
        models: { type: object, additionalProperties: { type: string } }
        defaults: { type: object, additionalProperties: { type: object, additionalProperties: { type: string } } }
        tasks: { type: array, items: { type: string } }
        embeddings:
          type: object
          required: [key_set, managed]
          properties:
            base_url: { type: string }
            model: { type: string }
            key_set: { type: boolean }
            managed: { type: boolean, description: "Fixed by the server config (assistant.embeddings.*, KMDN_ASSISTANT_EMBEDDINGS_*): read-only here" }
        user_daily_tokens: { type: integer }
        instance_monthly_tokens: { type: integer }
        consistency:
          type: object
          required: [scan_every_days, scan_max_calls]
          properties:
            scan_every_days: { type: integer, description: "0: scans only run on demand" }
            scan_max_calls: { type: integer, description: "LLM judgments per scan" }
        disabled: { type: boolean, description: "assistant.enabled is false in the server config" }
        managed: { type: boolean, description: "The provider, key, base URL and models are fixed by the server config (assistant.provider, KMDN_ASSISTANT_*): read-only here; saving changes budgets and scan settings only" }
        check:
          type: object
          required: [ok, message, at]
          properties:
            ok: { type: boolean }
            message: { type: string }
            at: { type: string, format: date-time }
    AIUsageRow:
      type: object
      required: [key, tokens, runs]
      properties:
        key: { type: string }
        name: { type: string }
        tokens: { type: integer }
        runs: { type: integer }
    Notification:
      type: object
      required: [id, kind, data, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        repo_id: { type: string }
        revision_id: { type: string }
        thread_id: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        data:
          type: object
          properties:
