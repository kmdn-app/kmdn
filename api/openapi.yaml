openapi: 3.1.0
info:
  title: kmdn API
  version: 0.1.0
  description: |
    REST API of the kmdn server. Paths are relative to `/api/v1`.

    Browser clients authenticate with the `kmdn_session` cookie. Unsafe
    methods (POST, PUT, PATCH, DELETE) must send the `X-Kmdn-CSRF` header with
    the value of the `kmdn_csrf` cookie (also returned as `csrf_token` by
    `GET /me`). Errors use RFC 9457 problem details with a stable `code`.
  license:
    name: AGPL-3.0
servers:
  - url: /api/v1
tags:
  - name: repos
  - name: people
  - name: auth
  - name: me
  - name: setup
  - name: admin
  - name: revisions
  - name: links
paths:
  /auth/magic-link:
    post:
      tags: [auth]
      operationId: requestMagicLink
      summary: Email a sign-in link and code
      description: Always answers 202 for a valid address, whether or not an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Sent (if the account exists)
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in_minutes]
                properties:
                  status: { type: string, enum: [sent] }
                  expires_in_minutes: { type: integer }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/magic-link/verify:
    post:
      tags: [auth]
      operationId: verifyMagicLink
      summary: Sign in with a link token, or an email and 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token: { type: string }
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9 ]{6,7}$" }
      responses:
        "200":
          description: Signed in; session cookies set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204": { description: Signed out }
  /me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                theme: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "422": { $ref: "#/components/responses/Problem" }
  /me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /me/sessions/{id}:
    delete:
      tags: [me]
      operationId: revokeMySession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/admin:
    post:
      tags: [setup]
      operationId: createFirstAdmin
      security: []
      description: Creates the first instance admin using the one-time token printed in the server log, and signs them in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, email]
              additionalProperties: false
              properties:
                token: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                instance_name: { type: string }
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /setup/complete:
    post:
      tags: [setup]
      operationId: completeSetup
      responses:
        "200":
          description: Setup marked complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/smtp:
    get:
      tags: [admin]
      operationId: getSMTP
      responses:
        "200":
          description: Current SMTP settings (password never returned)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPSettings" }
    put:
      tags: [admin]
      operationId: putSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPSettings" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/smtp/test:
    post:
      tags: [admin]
      operationId: testSMTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to: { type: string, format: email }
                settings: { $ref: "#/components/schemas/SMTPInput" }
      responses:
        "200":
          description: Result of the delivery attempt
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  to: { type: string }
                  error: { type: string }
                  hint: { type: string }
  /repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: Repositories the caller can see, with their role
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RepoView" } }
    post:
      tags: [repos]
      operationId: connectRepo
      summary: Connect a repository (instance admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepoInput" }
      responses:
        "202":
          description: Connected; the first sync runs as a job
          content:
            application/json:
              schema:
                type: object
                required: [repo, job_id]
                properties:
                  repo: { $ref: "#/components/schemas/RepoView" }
                  job_id: { type: string }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/by-slug/{owner}/{name}:
    get:
      tags: [repos]
      operationId: getRepoBySlug
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Repository, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepo
      responses:
        "200": { description: Repository, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [repos]
      operationId: updateRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepoInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RepoView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [repos]
      operationId: disconnectRepo
      responses:
        "204": { description: Disconnected (the forge repository is untouched) }
  /repos/{repo}/refresh:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [repos]
      operationId: refreshRepo
      responses:
        "202": { description: Sync scheduled, content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
  /repos/{repo}/tree:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoTree
      summary: Files in the content scope at the published head
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required: [head_sha, root, items]
                properties:
                  head_sha: { type: string }
                  root: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
  /repos/{repo}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: sha, in: query, schema: { type: string }, description: Commit to read at (default published head) }
    get:
      tags: [repos]
      operationId: getRepoFile
      responses:
        "200": { description: File, content: { application/json: { schema: { $ref: "#/components/schemas/RepoFile" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/raw/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: sha, in: query, schema: { type: string } }
    get:
      tags: [repos]
      operationId: getRawFile
      summary: File bytes for images, PDFs and markdown (sandboxed)
      responses:
        "200": { description: File content with a type fixed by extension }
        "304": { description: Not modified }
        "415": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/activity:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoActivity
      summary: Recent published changes to pages in scope
      responses:
        "200":
          description: Commits with the pages they changed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Commit"
                        - type: object
                          required: [paths]
                          properties: { paths: { type: array, items: { type: string } } }
  /repos/{repo}/history/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
      - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
    get:
      tags: [repos]
      operationId: getFileHistory
      summary: Published versions of a file (follows renames)
      responses:
        "200":
          description: Commits, newest first
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Commit" } } } }
  /repos/{repo}/blame/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [repos]
      operationId: getFileBlame
      responses:
        "200":
          description: Per-line attribution
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/BlameLine" } } } }
  /repos/{repo}/search:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: q, in: query, required: true, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
    get:
      tags: [repos]
      operationId: searchRepo
      summary: Full-text search over published pages
      description: Matched terms in `snippet` are wrapped in U+0002 … U+0003.
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } }
  /repos/{repo}/webhook:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: getRepoWebhook
      summary: Where to send push events (plain git and GitLab)
      responses:
        "200":
          description: Webhook endpoint and secret
          content:
            application/json:
              schema: { type: object, required: [url, secret, header], properties: { url: { type: string }, secret: { type: string }, header: { type: string } } }
  /repos/{repo}/members:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [repos]
      operationId: listRepoMembers
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } }
  /repos/{repo}/members/{type}/{id}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: type, in: path, required: true, schema: { type: string, enum: [user, group] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [repos]
      operationId: setRepoMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } }
      responses:
        "200":
          description: Updated grants
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } } }
    delete:
      tags: [repos]
      operationId: removeRepoMember
      responses:
        "204": { description: Removed }
  /admin/forges:
    get:
      tags: [admin]
      operationId: listForges
      responses:
        "200":
          description: Forge hosts
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ForgeHost" } } } }
    post:
      tags: [admin]
      operationId: createForge
      summary: Add a GitLab host or a plain git host (GitHub uses the manifest flow)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [gitlab, git] }
                base_url: { type: string }
                display_name: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ForgeHost" } } } }
  /admin/forges/{id}:
    delete:
      tags: [admin]
      operationId: deleteForge
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/forges/github/manifest:
    post:
      tags: [admin]
      operationId: githubManifest
      summary: Start the GitHub App manifest flow
      description: The browser then POSTs a form with field `manifest` to `action_url`; GitHub redirects back to /admin/forges/github/callback.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string, description: "GitHub web URL; empty for github.com" }
                organization: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Form target and manifest
          content:
            application/json:
              schema: { type: object, required: [action_url, manifest], properties: { action_url: { type: string }, manifest: { type: string } } }
  /admin/forges/github/callback:
    get:
      tags: [admin]
      operationId: githubCallback
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirects to the App installation page }
  /admin/forges/{id}/installations:
    get:
      tags: [admin]
      operationId: listGitHubInstallations
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Installations of the App
          content:
            application/json:
              schema:
                type: object
                required: [items, install_url]
                properties:
                  items: { type: array, items: { type: object, properties: { external_id: { type: string }, account_login: { type: string } } } }
                  install_url: { type: string }
  /admin/forges/{id}/repositories:
    get:
      tags: [admin]
      operationId: listInstallationRepos
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: installation, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Repositories the installation can access
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ForgeRepoInfo" } } } }
  /users:
    get:
      tags: [people]
      operationId: searchUsers
      summary: Find active users by name or email (member pickers)
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Up to 20 users
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserRef" } } } }
  /groups:
    get:
      tags: [people]
      operationId: listGroupsPublic
      summary: Groups (for granting repository roles)
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } }
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, deactivated] } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
  /admin/users/{id}:
    patch:
      tags: [admin]
      operationId: updateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_instance_admin: { type: boolean }
                status: { type: string, enum: [active, deactivated] }
                name: { type: string }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /admin/users/{id}/revoke-sessions:
    post:
      tags: [admin]
      operationId: revokeUserSessions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Sessions revoked }
  /admin/groups:
    get:
      tags: [admin]
      operationId: listGroups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } }
    post:
      tags: [admin]
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /admin/groups/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
    delete:
      tags: [admin]
      operationId: deleteGroup
      responses:
        "204": { description: Deleted (its repository grants are removed too) }
  /admin/groups/{id}/members:
    get:
      tags: [admin]
      operationId: listGroupMembers
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
  /admin/groups/{id}/members/{user}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: addGroupMember
      responses:
        "200":
          description: Members after adding
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } }
    delete:
      tags: [admin]
      operationId: removeGroupMember
      responses:
        "204": { description: Removed }
  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      responses:
        "200":
          description: Latest 200 audit entries
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } }
  /admin/invites:
    post:
      tags: [admin]
      operationId: inviteUser
      summary: Invite someone to the instance, optionally with a repository role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                repo_id: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Invited or granted, content: { application/json: { schema: { $ref: "#/components/schemas/InviteResult" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/invites:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    post:
      tags: [repos]
      operationId: inviteToRepo
      summary: Invite someone to a repository (repository admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Invited, or granted directly for an existing account, content: { application/json: { schema: { $ref: "#/components/schemas/InviteResult" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /invites/{token}:
    get:
      tags: [people]
      operationId: getInvite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invite details, content: { application/json: { schema: { $ref: "#/components/schemas/InviteDetails" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /invites/{token}/accept:
    post:
      tags: [people]
      operationId: acceptInvite
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "200": { description: Accepted and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /auth/oauth/providers:
    get:
      tags: [auth]
      operationId: listOAuthProviders
      security: []
      responses:
        "200":
          description: Forges people can sign in with
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [id, kind, display_name], properties: { id: { type: string }, kind: { type: string }, display_name: { type: string } } } }
  /auth/oauth/{host}/start:
    get:
      tags: [auth]
      operationId: startOAuth
      security: []
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [signin, link] } }
        - { name: redirect, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the forge }
  /auth/oauth/{host}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      security: []
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to kmdn, signed in or linked (errors in query string) }
  /me/linked-accounts:
    get:
      tags: [me]
      operationId: listLinkedAccounts
      responses:
        "200":
          description: Linked forge accounts
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LinkedAccount" } } } }
  /me/linked-accounts/{id}:
    delete:
      tags: [me]
      operationId: unlinkAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Unlinked }
  /me/commit-email:
    put:
      tags: [me]
      operationId: setCommitEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [forge_noreply, account, custom] }
                custom: { type: string, format: email }
      responses:
        "204": { description: Saved }
  /repos/{repo}/revisions:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [revisions]
      operationId: listRevisions
      summary: Revisions, most recently updated first
      parameters:
        - { name: state, in: query, schema: { type: string }, description: "open (default), all, or comma-separated states" }
        - { name: mine, in: query, schema: { type: boolean }, description: Only revisions the caller edits }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionView" } }
    post:
      tags: [revisions]
      operationId: createRevision
      summary: Start a revision on the published head
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevisionCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/revisions/by-number/{number}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { name: number, in: path, required: true, schema: { type: integer } }
    get:
      tags: [revisions]
      operationId: getRevisionByNumber
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/templates:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
    get:
      tags: [revisions]
      operationId: listTemplates
      summary: Page templates in .kmdn/templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
  /revisions/{revision}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [revisions]
      operationId: updateRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/close:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: closeRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/reopen:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [revisions]
      operationId: reopenRevision
      responses:
        "200": { description: Revision, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionView" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/tree:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevisionTree
      summary: The base tree with the revision's file changes applied
      responses:
        "200":
          description: Tree
          content:
            application/json:
              schema:
                type: object
                required: [base_sha, root, items]
                properties:
                  base_sha: { type: string }
                  root: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionTreeNode" } }
  /revisions/{revision}/files:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionFiles
      summary: The manifest
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionFile" } }
    post:
      tags: [revisions]
      operationId: revisionFileOp
      summary: Add, modify, rename or delete a page
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RevisionFileOp" } } }
      responses:
        "200": { description: Manifest entry, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionFile" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getRevisionFile
      summary: A page as seen in the revision
      responses:
        "200": { description: Content, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionContent" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/members:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionMember" } }
  /revisions/{revision}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [revisions]
      operationId: addRevisionMember
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionMember" } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [revisions]
      operationId: removeRevisionMember
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/events:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionEvents
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionEvent" } }
  /revisions/{revision}/checkpoints:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listCheckpoints
      summary: Checkpoints, newest first
      responses:
        "200":
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Checkpoint" } }
    post:
      tags: [revisions]
      operationId: nameCheckpoint
      summary: Name the current state
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Checkpoint, content: { application/json: { schema: { $ref: "#/components/schemas/Checkpoint" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/files:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
    get:
      tags: [revisions]
      operationId: listCheckpointFiles
      responses:
        "200":
          description: Files at the checkpoint (without content)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CheckpointFile" } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getCheckpointFile
      responses:
        "200": { description: File, content: { application/json: { schema: { $ref: "#/components/schemas/CheckpointFile" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checkpoints/{checkpoint}/restore:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { name: checkpoint, in: path, required: true, schema: { type: string } }
    post:
      tags: [revisions]
      operationId: restoreCheckpoint
      summary: Bring the revision back to a checkpoint, as a new change
      responses:
        "204": { description: Restored }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/assets:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: listRevisionAssets
      responses:
        "200":
          description: Images the revision adds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RevisionAsset" } }
    post:
      tags: [revisions]
      operationId: uploadRevisionAsset
      summary: Upload an image next to a page
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, page]
              properties:
                file: { type: string, format: binary }
                page: { type: string, description: The page the image is inserted into }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/UploadResult" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/raw/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [revisions]
      operationId: getRevisionRaw
      summary: An image as the revision sees it (uploads, then the base)
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
  /repos/{repo}/links/{path}:
    parameters:
      - { $ref: "#/components/parameters/RepoID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [links]
      operationId: getPageLinks
      summary: A published page's outgoing links (checked) and backlinks
      responses:
        "200": { description: Links, content: { application/json: { schema: { $ref: "#/components/schemas/PageLinks" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/links/{path}:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
      - { $ref: "#/components/parameters/FilePath" }
    get:
      tags: [links]
      operationId: getRevisionPageLinks
      summary: A page's links as the revision sees it
      responses:
        "200": { description: Links, content: { application/json: { schema: { $ref: "#/components/schemas/PageLinks" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/checks:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [links]
      operationId: getRevisionChecks
      summary: Broken links in changed pages, and published links the revision would break
      responses:
        "200": { description: Checks, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionChecks" } } } }
  /revisions/{revision}/files/rename-preview:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [links]
      operationId: renamePreview
      summary: Link changes a move needs (inbound links and the page's own relative links)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MoveInput" } } }
      responses:
        "200":
          description: Rewrites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LinkRewrite" } }
  /revisions/{revision}/links/rewrite:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    post:
      tags: [links]
      operationId: rewriteLinks
      summary: Update links after a page moved (adds linking pages to the revision)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MoveInput" } } }
      responses:
        "200":
          description: Pages changed
          content: { application/json: { schema: { type: object, required: [pages], properties: { pages: { type: integer } } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /revisions/{revision}/presence:
    parameters:
      - { $ref: "#/components/parameters/RevisionID" }
    get:
      tags: [revisions]
      operationId: getRevisionPresence
      summary: Who has pages of the revision open (updates arrive as "presence" events)
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PresenceUser" } }
components:
  parameters:
    RepoID:
      name: repo
      in: path
      required: true
      schema: { type: string }
    RevisionID:
      name: revision
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: Repository-relative path; may contain slashes
      schema: { type: string }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: kmdn_session
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PresenceUser:
      type: object
      required: [id, name, paths, editing]
      properties:
        id: { type: string }
        name: { type: string }
        paths: { type: array, items: { type: string } }
        editing: { type: boolean }
    OutboundLink:
      type: object
      required: [url, kind, line]
      properties:
        url: { type: string }
        kind: { type: string, enum: [relative, route, anchor, external] }
        to_path: { type: string }
        anchor: { type: string }
        line: { type: integer }
        image: { type: boolean }
        broken: { type: string, enum: [missing_page, missing_anchor] }
    InboundLink:
      type: object
      required: [from_path, url, line]
      properties:
        from_path: { type: string }
        url: { type: string }
        anchor: { type: string }
        line: { type: integer }
    PageLinks:
      type: object
      required: [outgoing, incoming]
      properties:
        outgoing: { type: array, items: { $ref: "#/components/schemas/OutboundLink" } }
        incoming: { type: array, items: { $ref: "#/components/schemas/InboundLink" } }
    BrokenLink:
      type: object
      required: [path, line, url, reason]
      properties:
        path: { type: string }
        line: { type: integer }
        url: { type: string }
        reason: { type: string, enum: [missing_page, missing_anchor] }
        target: { type: string }
    RevisionChecks:
      type: object
      required: [broken_links, breaks_inbound]
      properties:
        broken_links: { type: array, items: { $ref: "#/components/schemas/BrokenLink" } }
        breaks_inbound: { type: array, items: { $ref: "#/components/schemas/BrokenLink" } }
    MoveInput:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkRewrite:
      type: object
      required: [path, line, before, after]
      properties:
        path: { type: string }
        line: { type: integer }
        before: { type: string }
        after: { type: string }
    RevisionAsset:
      type: object
      required: [id, path, size, mime, sha256, created_at]
      properties:
        id: { type: string }
        path: { type: string }
        size: { type: integer }
        mime: { type: string }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
    UploadResult:
      allOf:
        - $ref: "#/components/schemas/RevisionAsset"
        - type: object
          required: [markdown, src]
          properties:
            markdown: { type: string }
            src: { type: string, description: Path relative to the page }
    Checkpoint:
      type: object
      required: [id, kind, created_at, file_count]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [auto, named, submit, pre_update, pre_restore] }
        created_by: { type: string }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        file_count: { type: integer }
    CheckpointFile:
      type: object
      required: [path, op]
      properties:
        path: { type: string }
        op: { $ref: "#/components/schemas/FileOpKind" }
        from_path: { type: string }
        content: { type: string }
    RevisionState:
      type: string
      enum: [editing, in_review, approved, publishing, published, closed]
    Revision:
      type: object
      required: [id, repo_id, number, title, description, state, changes_requested, has_conflicts, review_round, base_sha, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        repo_id: { type: string }
        number: { type: integer }
        title: { type: string }
        description: { type: string }
        state: { $ref: "#/components/schemas/RevisionState" }
        changes_requested: { type: boolean }
        has_conflicts: { type: boolean }
        review_round: { type: integer }
        base_sha: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        published_sha: { type: string }
        change_request_url: { type: string }
        closed_at: { type: string, format: date-time }
    RevisionAccess:
      type: object
      required: [member, can_edit, can_manage]
      properties:
        member: { type: boolean }
        can_edit: { type: boolean }
        can_manage: { type: boolean }
        reason: { type: string, description: "Why editing is off: viewer, not_member, or the revision state" }
    RevisionMember:
      type: object
      required: [user_id, name, email, role, added_at]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, editor] }
        added_at: { type: string, format: date-time }
    RevisionView:
      allOf:
        - $ref: "#/components/schemas/Revision"
        - type: object
          required: [access, members, file_count]
          properties:
            access: { $ref: "#/components/schemas/RevisionAccess" }
            members: { type: array, items: { $ref: "#/components/schemas/RevisionMember" } }
            file_count: { type: integer }
    RevisionCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        path: { type: string, description: Add this page right away }
        op: { type: string, enum: [modify, add] }
        template: { type: string }
    FileOpKind:
      type: string
      enum: [add, modify, rename, delete]
    RevisionFile:
      type: object
      required: [id, path, op, has_conflicts, additions, deletions, updated_at]
      properties:
        id: { type: string }
        path: { type: string }
        op: { $ref: "#/components/schemas/FileOpKind" }
        from_path: { type: string }
        content_hash: { type: string }
        materialized_at: { type: string, format: date-time }
        has_conflicts: { type: boolean }
